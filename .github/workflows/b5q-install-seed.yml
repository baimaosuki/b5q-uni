name: b5q fresh macOS installation Data seed
on:
  push:
    branches: [main]
    paths: ['.github/workflows/b5q-install-seed.yml', 'scripts/b5q-install/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    if: ${{ !contains(github.event.head_commit.message, '[payload-only]') && !contains(github.event.head_commit.message, '[reuse-data]') }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 8542980d02b4d2cc5c32ee3542de1760b2562aac
          path: pinned-UniXNU
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/DarwinBoot
          ref: 5243c68ec332a227fe3680cd5da6d5a0e127035c
          path: pinned-UniXNU/drivers/DarwinBoot
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install official AEA key retrieval tool
        run: |
          brew install blacktop/tap/ipsw
          git -C pinned-UniXNU apply ../UniXNU-b5q/patches/tools/macos-2g-ram-data.patch
      - name: Make Data from a newly extracted IPSW OS template
        env:
          UNIXNU_IPSW_JOBS: '16'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b5q-install/logs"
          python3 scripts/b5q-install/build-data-seed.py --unixnu pinned-UniXNU --out "$RUNNER_TEMP/b5q-install" --gpt scripts/b5q-install/gpt-input.json --ram-gib 2 --skip-setup --disable-watchdogd 2>&1 | tee "$RUNNER_TEMP/b5q-install/logs/data-seed.log"
      - name: Upload actual Data seed and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: b5q-install-seed-${{ github.run_id }}
          path: ${{ runner.temp }}/b5q-install/
          retention-days: 3
