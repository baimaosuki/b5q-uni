name: b5q existing-run linker diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/b5q-diagnostics.yml']
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        default: '44452872414'
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read actual failed-run logs with scoped Actions identity
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: ${{ inputs.run_id || '44452872414' }}
        run: |
          python3 - <<'PY'
          import io,json,os,re,sys,traceback,urllib.request,urllib.error,urllib.parse,zipfile
          def exception(kind,error,tb):
              message=''.join(traceback.format_exception(kind,error,tb))
              message=re.sub(r'https?://[^\s]+', '[redacted URL]', message)
              message=message.replace(os.environ['GH_TOKEN'],'***').replace('%','%25').replace('\n','%0A').replace('\r','%0D')
              print('::error title=b5q diagnostic retrieval failure::'+message)
          sys.excepthook=exception
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          run=os.environ['TARGET_RUN']
          if not run.isdigit():raise SystemExit('Invalid run ID')
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'b5q-first-error'})
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*args,**kwargs):return None
              try:
                  response=urllib.request.build_opener(NoRedirect).open(req,timeout=90)
              except urllib.error.HTTPError as error:
                  if error.code!=302:raise
                  target=error.headers['Location']
                  parsed=urllib.parse.urlsplit(target)
                  if parsed.scheme!='https' or not any((parsed.hostname or '').endswith(suffix) for suffix in ('.blob.core.windows.net','.actions.githubusercontent.com','.githubusercontent.com','.amazonaws.com')):
                      raise RuntimeError('Unexpected artifact redirect host')
                  # Never forward GitHub Authorization to signed object storage.
                  response=urllib.request.urlopen(urllib.request.Request(target,headers={'User-Agent':'b5q-first-error'}),timeout=90)
              with response:return response.read(128*1024*1024)
          import pathlib
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'b5q-prior-run'
          (output/'logs').mkdir(parents=True,exist_ok=True)
          payload=get('/actions/runs/'+run+'/logs')
          symbols=[]
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              paths=[name for name in z.namelist() if name.endswith('.txt') and any(x in name.lower() for x in ('payload','xnu','kernel'))]
              if not paths:raise RuntimeError('Target job text logs missing')
              for index,name in enumerate(paths):
                  text=z.read(name).decode(errors='replace')
                  (output/'logs'/(f'{index:02d}-'+name.split('/')[-1])).write_text(text)
                  if 'payload' in name.lower():
                      lines=text.splitlines()[-35:]
                      for at in range(0,len(lines),8):
                          message='\n'.join(lines[at:at+8]).replace('%','%25').replace('\n','%0A').replace('\r','%0D')
                          print('::warning title=b5q actual payload failure::'+message)
                  start=text.rfind('Undefined symbols for architecture')
                  if start<0:continue
                  block=text[start:].split('ld: symbol(s) not found',1)[0]
                  for line in block.splitlines():
                      match=re.search(r'"([^"\n]+)", referenced from:',line)
                      if match and match[1] not in symbols:symbols.append(match[1])
          print('Exact unresolved symbols from actual final link:',len(symbols))
          if not symbols:print('No undefined-symbol block; kernel may already be linked.')
          for start in range(0,len(symbols),8):
              message=' | '.join(symbols[start:start+8]).replace('%','%25').replace('\n','%0A').replace('\r','%0D')
              print(f'::warning title=b5q unresolved symbols {start+1}-{min(start+8,len(symbols))}::'+message)
          PY
      - name: Relay complete actual final linker log
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 UniXNU-b5q/scripts/ci-transfer.py send --root "$RUNNER_TEMP/b5q-prior-run" --public UniXNU-b5q/scripts/ci-recipient-public.pem --out "$RUNNER_TEMP/b5q-prior-transfer" --publish
