name: b5q existing-run linker diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/b5q-diagnostics.yml']
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        default: '44408313251'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read actual failed-run logs with scoped Actions identity
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: ${{ inputs.run_id || '44408313251' }}
        run: |
          python3 - <<'PY'
          import io,json,os,re,urllib.request,zipfile
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          run=os.environ['TARGET_RUN']
          if not run.isdigit():raise SystemExit('Invalid run ID')
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'b5q-first-error'})
              with urllib.request.urlopen(req,timeout=90) as response:return response.read(128*1024*1024)
          artifacts=json.loads(get('/actions/runs/'+run+'/artifacts'))['artifacts']
          wanted=[a for a in artifacts if a['name'].startswith('b5q-kernel-logs-')]
          if not wanted:raise SystemExit('No kernel text log artifact in requested run')
          payload=get('/actions/artifacts/'+str(wanted[0]['id'])+'/zip')
          symbols=[]
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              for name in z.namelist():
                  if name.split('/')[-1] not in ('kernel.log','kernel-console.log'):continue
                  text=z.read(name).decode(errors='replace')
                  for line in text.splitlines():
                      if re.match(r'^\s+"[^"\n]+", referenced from:',line):
                          symbol=line.strip().split('"')[1]
                          if symbol not in symbols:symbols.append(symbol)
          print('Exact unresolved symbols from actual final link:',len(symbols))
          if not symbols:raise SystemExit('No undefined-symbol block found; inspect uploaded source logs')
          for start in range(0,len(symbols),8):
              message=' | '.join(symbols[start:start+8]).replace('%','%25').replace('\n','%0A').replace('\r','%0D')
              print(f'::warning title=b5q unresolved symbols {start+1}-{min(start+8,len(symbols))}::'+message)
          PY
