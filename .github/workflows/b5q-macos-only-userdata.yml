name: b5q macOS-only userdata Data (two storage objects)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  incremental:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      UNIXNU_DEVICE: ${{ github.workspace }}/UniXNU-b5q
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 8542980d02b4d2cc5c32ee3542de1760b2562aac
          path: UniXNU
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/Library/Caches/Homebrew
          key: macOS-ARM64-xcode26.6-b5q-brew-v1-44930613230
          restore-keys: macOS-ARM64-xcode26.6-b5q-brew-v1-
      - name: Prepare packaging tools
        run: |
          set -euo pipefail
          brew install llvm lld mtools dtc blacktop/tap/ipsw
          python3 -m pip install capstone
          git -C UniXNU apply ../UniXNU-b5q/patches/tools/macos-2g-ram-data.patch
          git -C UniXNU apply ../UniXNU-b5q/patches/tools/b5q-turnip-oneui.patch
          git -C UniXNU apply ../UniXNU-b5q/patches/tools/b5q-validation-post-seal.patch
      - name: Reuse completed Batch1 kernel, Data and addon
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          B5Q_V24_INPUT_0: ${{ secrets.B5Q_V24_INPUT_0 }}
          B5Q_V24_INPUT_1: ${{ secrets.B5Q_V24_INPUT_1 }}
          B5Q_V24_INPUT_2: ${{ secrets.B5Q_V24_INPUT_2 }}
          B5Q_V24_INPUT_3: ${{ secrets.B5Q_V24_INPUT_3 }}
          B5Q_V24_INPUT_4: ${{ secrets.B5Q_V24_INPUT_4 }}
          B5Q_V24_INPUT_5: ${{ secrets.B5Q_V24_INPUT_5 }}
          B5Q_V24_INPUT_6: ${{ secrets.B5Q_V24_INPUT_6 }}
          B5Q_V24_INPUT_7: ${{ secrets.B5Q_V24_INPUT_7 }}
        run: |
          set -euo pipefail
          UniXNU/unixnu defconfig b5q_macos_defconfig --device UniXNU-b5q --os macos-27.3-26C5035r
          gh run download 45047962341 --repo "$GITHUB_REPOSITORY" \
            --name b5q-build-45047962341 --dir "$RUNNER_TEMP/batch2-cache"
          python3 UniXNU-b5q/scripts/stage-v24-inputs.py --unixnu UniXNU \
            --artifact "$RUNNER_TEMP/batch2-cache" --inputs "$RUNNER_TEMP/batch2-inputs" \
            --data-out "$RUNNER_TEMP/batch2-shared"
          python3 UniXNU-b5q/scripts/reuse-completed-build.py --unixnu UniXNU --device UniXNU-b5q \
            --artifact "$RUNNER_TEMP/batch2-cache" --data-out "$RUNNER_TEMP/batch2-data" \
            --source-run 45047962341 --source-commit 5d7c4eadaa5344e1b96edc593b26d6d18d2bc6d0
          echo "BATCH2_DATA=$RUNNER_TEMP/batch2-data/data.dbr" >> "$GITHUB_ENV"
      - name: Retain the verified v30 physical ESP loader
        run: |
          cp UniXNU-b5q/inputs/DarwinBoot-v30.efi "$RUNNER_TEMP/batch2-inputs/DarwinBoot.efi"
      - name: Prepare only the official payload tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UniXNU/unixnu tree --device UniXNU-b5q --os macos-27.3-26C5035r
          python3 - "$RUNNER_TEMP/batch2-cache" <<'PYKEEP'
          from pathlib import Path
          import shutil, sys
          sys.path.insert(0, "UniXNU/scripts")
          from unixnu.cli import parser
          from unixnu.config import Context
          ctx = Context(parser().parse_args(["build", "payload", "--device", "UniXNU-b5q", "--os", "macos-27.3-26C5035r"]))
          source = next(Path(sys.argv[1]).rglob("package.manifest.json")).parent
          # Preserve every completed object/archive for later incremental work.
          shutil.copytree(source / "tree/build", ctx.tree / "build", dirs_exist_ok=True)
          shutil.copytree(source / "kernel/incremental-objects", ctx.work / "kernel/incremental-objects", dirs_exist_ok=True)
          PYKEEP
      - name: Fetch pinned headers for the cached-core relink
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UniXNU/unixnu fetch xnu IOHIDFamily IOStorageFamily --device UniXNU-b5q --os macos-27.3-26C5035r
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            UniXNU/out/b5q/**/tree/build/native-legacy-display/libNativeLegacyDisplay.late.a
            UniXNU/out/b5q/**/tree/build/ram-block/libRamBlock.a
            UniXNU/out/b5q/**/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
            UniXNU/out/b5q/**/kernel/
          key: macOS-ARM64-xcode26.6-batch2-c25ad96971926650979bacab4aff5c3297149dc0ad6bb5e4c6ac5a90db6ea689-45108577992
      - name: Compile only the two storage objects using the completed Batch2 archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/userdata-native-cache" <<'PYSNAPSHOT'
          import hashlib, importlib.util, json, shutil, sys
          from pathlib import Path
          sys.path.insert(0, "UniXNU/scripts")
          from unixnu.cli import parser
          from unixnu.config import Context
          ctx=Context(parser().parse_args(["build","payload","--device","UniXNU-b5q","--os","macos-27.3-26C5035r"]))
          record=json.loads((ctx.work/"kernel/incremental-relink.json").read_text())
          assert record["relink_version"]=="batch2" and record["board_translation_units_compiled"]==6
          def sha(p):
              with p.open("rb")as f:return hashlib.file_digest(f,"sha256").hexdigest()
          changed={p for p,d in record["source_sha256"].items() if sha(Path("UniXNU-b5q/package")/p)!=d}
          assert changed=={"B5qRamStorage.cpp","B5qUfs/B5qUfs.cpp","B5qUfs/B5qDataFormat.h"},changed
          for rel,digest in record["archive_outputs"].items():assert sha(ctx.tree/rel)==digest,rel
          spec=importlib.util.spec_from_file_location("relink","UniXNU-b5q/scripts/relink-b5q-peripherals.py")
          relink=importlib.util.module_from_spec(spec);spec.loader.exec_module(relink)
          dest=Path(sys.argv[1])
          for rel in [*relink.LINK_INPUTS,relink.USB,relink.NATIVE]:
              target=dest/rel;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(ctx.tree/rel,target)
          shutil.copyfile(ctx.work/"kernel/incremental-relink.json",dest/"batch2-baseline.json")
          PYSNAPSHOT
          python3 UniXNU-b5q/scripts/relink-b5q-peripherals.py --version userdata \
            --unixnu UniXNU --device UniXNU-b5q \
            --cached-tree "$RUNNER_TEMP/userdata-native-cache" \
            --changed B5qRamStorage.cpp,B5qUfs/B5qUfs.cpp --reused-data "$BATCH2_DATA" \
            --out "$RUNNER_TEMP/batch2-relink" 2>&1 | tee "$RUNNER_TEMP/batch2-relink.log"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/uefi-sheng
          ref: b303410c8e401fc9419ae65a024356ed09a438ef
          path: font-reference
          sparse-checkout: Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib
          persist-credentials: false
      - name: Generate official ADT, payload and 4Kn ESP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 UniXNU-b5q/scripts/build-b5q-payload.py --unixnu UniXNU --device UniXNU-b5q \
            --font-source font-reference --data-ramdisk "$BATCH2_DATA" --reuse-addon 2>&1 | tee "$RUNNER_TEMP/batch2-payload.log"
          python3 UniXNU-b5q/scripts/package-batch2-esp.py --unixnu UniXNU --inputs "$RUNNER_TEMP/batch2-inputs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/DarwinBoot
          ref: 5243c68ec332a227fe3680cd5da6d5a0e127035c
          path: seed-codec
          persist-credentials: false
      - name: Grow the verified Batch1 APFS volume for first-install UFS Data
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/batch2-delivery"
          python3 scripts/b5q-install/build-persistent-data.py --seed "$BATCH2_DATA" \
            --codec seed-codec --blocks 44188919 --out "$RUNNER_TEMP/batch2-delivery/data-ufs.img" 2>&1 | tee "$RUNNER_TEMP/batch2-data.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: userdata-object-and-diagnostics-${{ github.run_id }}
          path: |
            UniXNU/out/b5q/**/kernel/incremental-objects/
            UniXNU/out/b5q/**/kernel/incremental-relink.json
            UniXNU/out/b5q/**/kernel/kernel.json
            UniXNU/out/b5q/**/batch2-package.json
            ${{ runner.temp }}/batch2-relink.log
            ${{ runner.temp }}/batch2-payload.log
            ${{ runner.temp }}/batch2-data.log
            ${{ runner.temp }}/userdata-native-cache/batch2-baseline.json
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: b5q-userdata-images-${{ github.run_id }}
          path: |
            UniXNU/out/b5q/**/esp.img
            ${{ runner.temp }}/batch2-delivery/data-ufs.img
            ${{ runner.temp }}/batch2-delivery/data-ufs.json
          compression-level: 1
          retention-days: 3
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: |
            UniXNU/out/b5q/**/tree/build/native-legacy-display/libNativeLegacyDisplay.late.a
            UniXNU/out/b5q/**/tree/build/ram-block/libRamBlock.a
            UniXNU/out/b5q/**/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
            UniXNU/out/b5q/**/kernel/
          key: macOS-ARM64-xcode26.6-userdata-${{ hashFiles('UniXNU-b5q/package/**', 'UniXNU-b5q/scripts/relink-b5q-peripherals.py') }}-${{ github.run_id }}
