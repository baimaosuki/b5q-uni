name: b5q macOS payload-only mount repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b5q-runtime.yml'
      - 'UniXNU-b5q/board.toml'
      - 'UniXNU-b5q/scripts/**'
      - 'UniXNU-b5q/patches/tools/**'
      - 'scripts/b5q-install/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[payload-only]') }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_IPSW_JOBS: '16'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      UNIXNU_DEVICE: ${{ github.workspace }}/UniXNU-b5q
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 8542980d02b4d2cc5c32ee3542de1760b2562aac
          path: UniXNU
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Prepare payload host tools and scoped seed tool adaptation
        run: |
          set -euo pipefail
          brew install llvm lld mtools dtc blacktop/tap/ipsw
          git -C UniXNU apply ../UniXNU-b5q/patches/tools/macos-2g-ram-data.patch
      - name: Resolve payload sources and retain completed v10 kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UniXNU/unixnu defconfig b5q_macos_defconfig --device UniXNU-b5q --os macos-27.3-26C5035r
          UniXNU/unixnu tree --device UniXNU-b5q --os macos-27.3-26C5035r
          gh run download 44606991063 --repo "$GITHUB_REPOSITORY" --name b5q-build-44606991063 --dir "$RUNNER_TEMP/v10-artifact"
          python3 UniXNU-b5q/scripts/reuse-v10-kernel.py --unixnu UniXNU --device UniXNU-b5q --artifact "$RUNNER_TEMP/v10-artifact"
      - name: Build 2GiB volatile Data with exact existing UUID
        run: |
          set -euo pipefail
          python3 scripts/b5q-install/build-data-seed.py --unixnu UniXNU --out "$RUNNER_TEMP/b5q-ram-data" --gpt scripts/b5q-install/gpt-input.json --ram-gib 2 --skip-setup --disable-watchdogd 2>&1 | tee "$RUNNER_TEMP/data-seed.log"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/uefi-sheng
          ref: b303410c8e401fc9419ae65a024356ed09a438ef
          path: font-reference
          sparse-checkout: Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib
          persist-credentials: false
      - name: Build signed APFS boot shim and official payload using existing kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 UniXNU-b5q/scripts/build-b5q-payload.py --unixnu UniXNU --device UniXNU-b5q --font-source font-reference --data-ramdisk "$RUNNER_TEMP/b5q-ram-data/runtime/data.dbr" 2>&1 | tee "$RUNNER_TEMP/payload.log"
      - name: Upload actual kernel and payload outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: b5q-build-${{ github.run_id }}
          path: |
            UniXNU/out/b5q/**/kernel/kernel.macho
            UniXNU/out/b5q/**/kernel/*.json
            UniXNU/out/b5q/**/payload/payload.img
            UniXNU/out/b5q/**/payload/payload.json
            UniXNU/out/b5q/**/runtime/data-seed.json
            UniXNU/out/b5q/**/runtime/generated.json
            UniXNU/out/b5q/**/runtime/inputs.json
            UniXNU/out/b5q/**/kernel-reuse.json
            UniXNU/out/b5q/**/package.manifest.json
          if-no-files-found: warn
          compression-level: 1
          retention-days: 3
      - name: Upload construction logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: b5q-runtime-logs
          path: |
            UniXNU/out/b5q/**/logs/
            ${{ runner.temp }}/data-seed.log
            ${{ runner.temp }}/payload.log
          if-no-files-found: warn
          retention-days: 3
