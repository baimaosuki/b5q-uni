name: b5q macOS payload-only runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b5q-runtime.yml'
      - 'UniXNU-b5q/board.toml'
      - 'UniXNU-b5q/scripts/**'
      - 'UniXNU-b5q/package/**'
      - 'UniXNU-b5q/patches/tools/**'
      - 'scripts/b5q-install/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[payload-only]') }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_IPSW_JOBS: '16'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      UNIXNU_DEVICE: ${{ github.workspace }}/UniXNU-b5q
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 8542980d02b4d2cc5c32ee3542de1760b2562aac
          path: UniXNU
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Restore GPU source and incremental compiler caches
        id: gpu-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/.cache/mesa-work
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/.cache/gpu-reference/metal2vulkan
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/.cache/mesa-venv
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/.cache/mesa-tools
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/build/mesa-tu-macos27
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/build/adreno-metal-bridge
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/build/m2v-target
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/build/turnip-smoke
            ~/.cargo/registry
            ~/.cargo/git/db
          key: macOS-ARM64-xcode26.6-b5q-macos27-gpu-v1-b5010b20635f6db9c06948565333387ad8398223a324066c909ed14c934f627d-44794616634-1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode26.6-b5q-macos27-gpu-v1-${{ hashFiles('UniXNU/scripts/data/adreno-compiler-inputs.json', 'UniXNU/scripts/data/gpu-metal-vulkan-inputs.json', 'UniXNU/components.toml', 'UniXNU-b5q/patches/tools/b5q-turnip-oneui.patch') }}-
      - name: Restore Homebrew downloads
        id: brew-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/Library/Caches/Homebrew
          key: macOS-ARM64-xcode26.6-b5q-brew-v1-44794616634
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode26.6-b5q-brew-v1-
      - name: Prepare payload host tools and scoped seed tool adaptation
        run: |
          set -euo pipefail
          brew install llvm lld mtools dtc blacktop/tap/ipsw
          git -C UniXNU apply ../UniXNU-b5q/patches/tools/macos-2g-ram-data.patch
          git -C UniXNU apply ../UniXNU-b5q/patches/tools/b5q-turnip-oneui.patch
          git -C UniXNU apply ../UniXNU-b5q/patches/tools/b5q-validation-post-seal.patch
      - name: Reuse v21 Data/GPU and cached XNU core
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UniXNU/unixnu defconfig b5q_macos_defconfig --device UniXNU-b5q --os macos-27.3-26C5035r
          UniXNU/unixnu tree --device UniXNU-b5q --os macos-27.3-26C5035r
          UniXNU/unixnu fetch xnu IOHIDFamily --device UniXNU-b5q --os macos-27.3-26C5035r
          gh run download 44831204824 --repo "$GITHUB_REPOSITORY" --name b5q-build-44831204824 --dir "$RUNNER_TEMP/completed-artifact"
          python3 UniXNU-b5q/scripts/reuse-completed-build.py --unixnu UniXNU --device UniXNU-b5q --artifact "$RUNNER_TEMP/completed-artifact" --data-out "$RUNNER_TEMP/b5q-reused-data" --source-run 44831204824 --source-commit d38be559238dbde4e0999b423764442e7ac6ddc8
          gh run download 44789459847 --repo "$GITHUB_REPOSITORY" --name b5q-build-44789459847 --dir "$RUNNER_TEMP/cached-kernel"
          cp -R "$RUNNER_TEMP/completed-artifact/macos-27.3-26C5035r/b5q_macos/tree/build/." "$RUNNER_TEMP/cached-kernel/macos-27.3-26C5035r/b5q_macos/tree/build/"
          rm -rf "$RUNNER_TEMP/completed-artifact"
      - name: Recompile seven changed peripheral objects and relink cached core
        run: |
          set -euo pipefail
          python3 UniXNU-b5q/scripts/relink-b5q-peripherals.py --unixnu UniXNU --device UniXNU-b5q --cached-tree "$RUNNER_TEMP/cached-kernel/macos-27.3-26C5035r/b5q_macos/tree" --source-run 44831204824 --source-commit d38be559238dbde4e0999b423764442e7ac6ddc8 --changed B5qUsbHost.cpp,LegacyDisplayProbe.cpp,ThermalProbe.cpp,ThermalLevel.cpp,ButtonProbe.cpp,B5qTouch.cpp,GeniI2c.c --out "$RUNNER_TEMP/board-relink" 2>&1 | tee "$RUNNER_TEMP/board-relink.log"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/uefi-sheng
          ref: b303410c8e401fc9419ae65a024356ed09a438ef
          path: font-reference
          sparse-checkout: Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib
          persist-credentials: false
      - name: Build signed APFS boot shim and official payload using existing kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 UniXNU-b5q/scripts/build-b5q-payload.py --unixnu UniXNU --device UniXNU-b5q --font-source font-reference --data-ramdisk "$RUNNER_TEMP/b5q-reused-data/data.dbr" --reuse-addon 2>&1 | tee "$RUNNER_TEMP/payload.log"
      - name: Upload actual kernel and payload outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: b5q-build-${{ github.run_id }}
          path: |
            UniXNU/out/b5q/**/tree/build/native-legacy-display/libNativeLegacyDisplay.late.a
            UniXNU/out/b5q/**/tree/build/adreno740/libAdreno740.a
            UniXNU/out/b5q/**/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
            UniXNU/out/b5q/**/kernel/kernel.macho
            UniXNU/out/b5q/**/kernel/*.json
            UniXNU/out/b5q/**/payload/payload.img
            UniXNU/out/b5q/**/payload/payload.json
            UniXNU/out/b5q/**/runtime/data-seed.json
            UniXNU/out/b5q/**/runtime/data.dbr
            UniXNU/out/b5q/**/runtime/generated.json
            UniXNU/out/b5q/**/runtime/inputs.json
            UniXNU/out/b5q/**/kernel-reuse.json
            UniXNU/out/b5q/**/package.manifest.json
          if-no-files-found: warn
          compression-level: 1
          retention-days: 3
      - name: Upload construction logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: b5q-runtime-logs
          path: |
            UniXNU/out/b5q/**/logs/
            ${{ runner.temp }}/data-seed.log
            ${{ runner.temp }}/payload.log
            ${{ runner.temp }}/board-relink.log
            ${{ runner.temp }}/board-relink/**/*.json
            ${{ runner.temp }}/board-relink/**/*.o
          if-no-files-found: warn
          retention-days: 3

      - name: Save completed incremental GPU work, including failed payload attempts
        if: ${{ always() && steps.gpu-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/.cache/mesa-work
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/.cache/gpu-reference/metal2vulkan
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/.cache/mesa-venv
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/.cache/mesa-tools
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/build/mesa-tu-macos27
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/build/adreno-metal-bridge
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/build/m2v-target
            UniXNU/out/b5q/macos-27.3-26C5035r/b5q_macos/tree/build/turnip-smoke
            ~/.cargo/registry
            ~/.cargo/git/db
          key: ${{ steps.gpu-cache.outputs.cache-primary-key }}
      - name: Save Homebrew download cache
        if: ${{ always() && steps.brew-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ steps.brew-cache.outputs.cache-primary-key }}
