name: b5q Batch 1 final launchd and resident service package
on:
  workflow_dispatch:
  push:
    branches:
      - codex/b5q-batch1-final-proctop
permissions:
  contents: read
  actions: read
jobs:
  incremental:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      UNIXNU_DEVICE: ${{ github.workspace }}/UniXNU-b5q
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 8542980d02b4d2cc5c32ee3542de1760b2562aac
          path: UniXNU
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/Library/Caches/Homebrew
          key: macOS-ARM64-xcode26.6-b5q-brew-v1-44930613230
          restore-keys: macOS-ARM64-xcode26.6-b5q-brew-v1-
      - name: Prepare packaging tools
        run: |
          set -euo pipefail
          brew install llvm lld mtools dtc blacktop/tap/ipsw
          git -C UniXNU apply ../UniXNU-b5q/patches/tools/macos-2g-ram-data.patch
          git -C UniXNU apply ../UniXNU-b5q/patches/tools/b5q-turnip-oneui.patch
          git -C UniXNU apply ../UniXNU-b5q/patches/tools/b5q-validation-post-seal.patch
      - name: Reuse completed Batch1 kernel, Data and addon
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          B5Q_V24_INPUT_0: ${{ secrets.B5Q_V24_INPUT_0 }}
          B5Q_V24_INPUT_1: ${{ secrets.B5Q_V24_INPUT_1 }}
          B5Q_V24_INPUT_2: ${{ secrets.B5Q_V24_INPUT_2 }}
          B5Q_V24_INPUT_3: ${{ secrets.B5Q_V24_INPUT_3 }}
          B5Q_V24_INPUT_4: ${{ secrets.B5Q_V24_INPUT_4 }}
          B5Q_V24_INPUT_5: ${{ secrets.B5Q_V24_INPUT_5 }}
          B5Q_V24_INPUT_6: ${{ secrets.B5Q_V24_INPUT_6 }}
          B5Q_V24_INPUT_7: ${{ secrets.B5Q_V24_INPUT_7 }}
        run: |
          set -euo pipefail
          UniXNU/unixnu defconfig b5q_macos_defconfig --device UniXNU-b5q --os macos-27.3-26C5035r
          gh run download 45047962341 --repo "$GITHUB_REPOSITORY" \
            --name b5q-build-45047962341 --dir "$RUNNER_TEMP/batch1-final-cache"
          python3 UniXNU-b5q/scripts/stage-v24-inputs.py --unixnu UniXNU \
            --artifact "$RUNNER_TEMP/batch1-final-cache" --inputs "$RUNNER_TEMP/batch1-final-inputs" \
            --data-out "$RUNNER_TEMP/batch1-final-shared"
          python3 UniXNU-b5q/scripts/reuse-completed-build.py --unixnu UniXNU --device UniXNU-b5q \
            --artifact "$RUNNER_TEMP/batch1-final-cache" --data-out "$RUNNER_TEMP/batch1-final-data" \
            --source-run 45041019820 --source-commit ac082c9d53049323fd701cec5d6ba5bd7621bc1f
          echo "BATCH1_FINAL_DATA=$RUNNER_TEMP/batch1-final-data/data.dbr" >> "$GITHUB_ENV"
      - name: Stage the previously verified DarwinBoot loader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44983031320 --repo "$GITHUB_REPOSITORY" \
            --name b5q-uefi-fd-217d311278b77518d8df83cec65705512795dad7 --dir "$RUNNER_TEMP/v28-fd"
          python3 - "$RUNNER_TEMP/v28-fd" "$RUNNER_TEMP/batch1-final-inputs" <<'PYCI'
          from hashlib import sha256
          from pathlib import Path
          import sys
          sys.path.insert(0, "UniXNU/scripts")
          from unixnu.boot_template import loader_pe
          fd, = Path(sys.argv[1]).rglob("SILICIUM_UEFI.fd")
          data = fd.read_bytes()
          assert sha256(data).hexdigest() == "ccc6e8da9a9b0210d746865f6baf4979956d76e4c8c11c159a9d797e27b18cf8"
          (Path(sys.argv[2]) / "DarwinBoot.efi").write_bytes(
              loader_pe(data, "1b64af87-8415-4b57-9b16-680d70913b9f"))
          PYCI
      - name: Prepare only the official payload tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UniXNU/unixnu tree --device UniXNU-b5q --os macos-27.3-26C5035r
          python3 - "$RUNNER_TEMP/batch1-final-cache" <<'PYKEEP'
          from pathlib import Path
          import shutil, sys
          sys.path.insert(0, "UniXNU/scripts")
          from unixnu.cli import parser
          from unixnu.config import Context
          ctx = Context(parser().parse_args(["build", "payload", "--device", "UniXNU-b5q", "--os", "macos-27.3-26C5035r"]))
          source = next(Path(sys.argv[1]).rglob("package.manifest.json")).parent
          # Preserve every completed object/archive for later incremental work.
          shutil.copytree(source / "tree/build", ctx.tree / "build", dirs_exist_ok=True)
          shutil.copytree(source / "kernel/incremental-objects", ctx.work / "kernel/incremental-objects", dirs_exist_ok=True)
          PYKEEP
      - name: Fetch pinned headers for the cached-core relink
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UniXNU/unixnu fetch xnu IOHIDFamily --device UniXNU-b5q --os macos-27.3-26C5035r
      - name: Compile only B5qProcTop and relink the cached core
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 UniXNU-b5q/scripts/relink-b5q-peripherals.py --version batch1-proctop \
            --unixnu UniXNU --device UniXNU-b5q \
            --cached-tree "$RUNNER_TEMP/batch1-final-cache/macos-27.3-26C5035r/b5q_macos/tree" \
            --source-run 45041019820 --source-commit ac082c9d53049323fd701cec5d6ba5bd7621bc1f \
            --changed B5qProcTop.c --reused-data "$BATCH1_FINAL_DATA" \
            --out "$RUNNER_TEMP/batch1-final-relink" 2>&1 | tee "$RUNNER_TEMP/batch1-final-relink.log"
          mkdir -p "$RUNNER_TEMP/batch1-final-pac"
          (cd "$RUNNER_TEMP/batch1-final-pac" && xcrun ar -x \
            "$RUNNER_TEMP/batch1-final-cache/macos-27.3-26C5035r/b5q_macos/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.link/mach.development.bcm2837.a" \
            mac_process.o startup.o cswitch.o)
          python3 scripts/b5q-install/check-proctop-pac.py \
            --object "$RUNNER_TEMP/batch1-final-relink/board-input/B5qProcTop.o" \
            --core-objects "$RUNNER_TEMP/batch1-final-pac" \
            --out "$RUNNER_TEMP/batch1-final-proctop-pac.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/uefi-sheng
          ref: b303410c8e401fc9419ae65a024356ed09a438ef
          path: font-reference
          sparse-checkout: Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib
          persist-credentials: false
      - name: Generate official ADT, payload and 4Kn ESP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 UniXNU-b5q/scripts/build-b5q-payload.py --unixnu UniXNU --device UniXNU-b5q \
            --font-source font-reference --data-ramdisk "$BATCH1_FINAL_DATA" --reuse-addon 2>&1 | tee "$RUNNER_TEMP/batch1-final-payload.log"
          python3 UniXNU-b5q/scripts/package-v24-esp.py --unixnu UniXNU --inputs "$RUNNER_TEMP/batch1-final-inputs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: b5q-build-${{ github.run_id }}
          path: UniXNU/out/b5q/**/esp.img
          compression-level: 1
          retention-days: 3
      - name: Release temporary source artifact and staging inputs
        if: always()
        run: |
          python3 - <<'PYCLEAN'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          for name in ("batch1-final-cache", "batch1-final-inputs", "batch1-final-shared", "batch1-final-data", "v28-fd", "batch1-final-pac", "batch1-final-relink"):
              target = root / name
              if target.is_dir() and target.resolve().parent == root:
                  shutil.rmtree(target)
          PYCLEAN
