ment checks disabled. CI now returns native kernel/archive intermediates to permit relink/payload reuse on future failure.", "2026-11-20 user latest main alignment: live UniXNU-sheng main remains c8f92b208068eeaa4cd2b0f592671f04ee70076e; all shared lock commits match. Core build pin advanced to8542980d02b4d2cc5c32ee3542de1760b2562aac (only device docs/catalog since old pin). Adopted generic dyld16K-on4K fixups/source release, bindfs file-ID resolution and hw.pagesize access. Added native-state public lockdown sysctl uint64 and explicit cs-lazy/boot-payload-release/exec-log with vmm-present u32. Photo proves PID1 SIGABRT and15.4MB free pages, not its userspace call chain; NABU matching failure is reference evidence. Device hardware tables and policies remain b5q-specific.", "2026-11-20 memory-v8 regression PASS using actual platform MemoryMapLib and exact RamManager ParseMemoryRange/HandleRamRange plus DarwinBoot RunEnd/AllocateWindow bodies with simulated EFI services. The old map selects 0x880004000; the new map selects 0x8c0004000 for 2GiB and no free run intersects the four live reservations. ASan/UBSan pass. The raw-FDT root listing returned partial output through fdtget, so the authoritative memory report uses the official token parser and direct /memory/reg instead of that incomplete listing.", "2026-11-20: captured real b5q SM-F731B recovery FDT, SHA256 74aaf1524d9aca9b8e01c1854fbfcdaf6060f189f3f37db00196d866e3d57be6. Its physical high bank spans 0x880000000..0xa00000000 but memory/reg omits 0x8b9a00000..0x8b9c00000 and 0x8bba00000..0x8c0000000. Enabled high reserved-memory nodes union to 0x880100000..0x880b02000 and 0x880c00000..0x88b900000. The b5q memory map now adds all four as reserved HOB-only ranges. No sheng numerical values are used.", "2026-11-20 ESP-v6 verification complete: new delivered ADT chosen/dram-base=0x80000000 (8B), dram-size=0x80000000 (8B), CTRR=0 (4B), sleep-disabled=1 (4B). QEMU used these exact DRAM properties without substitution; PE_create_console returned with vinfo populated.", "2026-11-20: user explicitly authorized the b5q low physical bank 0x80000000+0x80000000. Independently read b5q Mu reference DTB /ddr-regions region0; its first four big-endian cells are 0 80000000 0 80000000. This is distinct from its fragmented Linux memory/reg list. dts/b5q.dts now exports that physical classification range; allocation remains DarwinBoot EFI-owned memory. Earlier claim that no b5q physical-bank source existed was incorrect. No sheng reservation or DRAM input is copied.", "2026-11-20 correction: boot_args PhysicalBase/MemorySize are NOT chosen/dram-base/size. The deployed ESP-v2/v5 ADT has both DRAM properties zero; DarwinBoot does not replace them. An unmodified original kernel with that ADT and a synthetic QEMU framebuffer reaches pmap_map_bd_with_options and panics with gDramBase/gDramSize not initialized while vinfo is still zero. This proves an input defect, not the earliest physical-device stop. Reference b5q DT fragments are not promoted to measured physical banks; DRAM input remains unresolved and no new flash image is released.", "The reference b5q FDT has eight /memory/reg tuples; they are OS-visible fragments, not one contiguous allocatable range.", "UH guest 0xb1000000+0x3000000 and UH heap 0xb0200000+0x40000 occur in the Samsung FDT; Gunyah HYP is 0x80000000+0xa00000.", "QTEE is 0xd8300000+0x500000. No separately named RKP interval was found, and none was invented.", "The eventual XNU DTS and DarwinBoot window must be constructed from b5q evidence, not the sheng memory window.", "2026-11-19: All five inspected base0+overlay candidates have /memory/reg=<0 0> and no simple-framebuffer node; the eight memory tuples in the older reference inventory are not runtime banks extracted from this phone.", "The original-package candidates show HYP 0x80000000+0xa00000, TZ-stat 0x82700000+0x100000 and QTEE 0xd8300000+0x500000. No directly adoptable separately named UH/RKP interval was established; old reference UH values must not be promoted to runtime evidence.", "Four SoC bases and five B5Q revisions 04/05/07/09/11 were preserved. Only base0 x five overlays were merged successfully; this is neither hardware selection nor a verified 20-way matrix. Cached merges now require recorded base, overlay and merged SHA256 matches.", "2026-11-19 source integration: dts/b5q.dts compiles with the pinned SM8550 DTSI and exports GPU/GMU/SMMU ADT names while keeping UFS disabled. Only confirmed Samsung reservations are listed; runtime DRAM, remaining UH/RKP reservations and live framebuffer stay unknown. The official payload panic_screen entry-probe path is selected, but not claimed executed without a compiled/prelinked kernel.", "2026-11-19 UEFI source work: b5q DSC/FDF now wires UniXNU, UniXNUDxe, DarwinBoot and UniXNURamDiskDxe, with B5qHandoffDxe read-only runtime FDT/reservations/EFI-map/GOP diagnostics. Explicit UFSDxe/Sdcc/mass-storage/PIL modules and automatic RamManager expansion are removed from b5q dispatch lists. The reproducible patch is recorded in stage123-source-checks.json; no firmware compile, vendor internal-I/O audit, Samsung guard completion or runtime result is claimed.", "2026-11-19: Added collect-runtime-fdt.py to emit only hardware memory/reg, reserved-memory and memreserve facts. It uses adb exec-out cat /sys/firmware/fdt without block-device access, keeps raw FDT only in a temporary file, and emits no chosen/bootargs/serial/seed. Offline smoke input is explicitly labelled offline and correctly reports no nonzero memory bank; it is not a phone capture or a GOP observation.", "2026-11-19: the attached recovery identifies as nabu (Xiaomi Pad 5), not b5q. An initial read-only non-b5q capture was quarantined under ignored artifacts/non-b5q-rejected and never used as b5q evidence. The collector now checks b5q/SM-F731 before FDT capture. Its offline check against official Samsung base0+overlay0 reads /memory reg as zero/zero and 68 reserved nodes, demonstrating why static DT is insufficient; EFI GOP/map remain unknown.", "Compile-only payload preserves the Samsung static zero/zero memory placeholder in a correctly typed memory node. The actual ADT serializer was executed successfully (16272 bytes), with PackedRAMDisk handoff. DarwinBoot derives PhysicalBase/MemorySize from EFI allocation; no Samsung DRAM address or size is fabricated and no recovery capture is requested.", "2026-11-20 v9: wimg_to_pte RT/WCOMB now accepts managed high-bank pages via pa_valid; native RT selects WRITECOMB; non-RT batch transitions synchronize WIMG. This kernel change does not modify the already-corrected runtime-FDT firmware memory map.", "2026-11-20 v9 delivered: CI 44598173747 kernel and official payload steps succeeded with complete mapping, no missing symbols and allow_missing=false. Legacy transport final status PATCH failed HTTP404; all 3024 existing chunks recovered and authenticated locally without rebuilding. ESP800MiB/S4096/s1 SHA256 700af2c8e87b412581190af8e38e23c5993bec244e6c65ce80d32e5815f82f09. Actual ESP-extracted deployment kernel confirms 47-bit user VA and console call; POST and every FAT member roundtrip pass. No QEMU run per latest user; device runtime remains pending.", "2026-11-20 mount-v11: user reports UFS/root/launchd progress and mount-phase-1 abort. Source confirms29GiB seed writes refused by isBig&&!direct, missing runtime APFS boot shim and key-events gate. Payload-only rebuild reuses v10 kernel, requests4GiB owned memory, builds2GiB volatile Data with actual compiled48D8 UUID (attachment48D0 is wrong), adds typed maxvnodes and documented startup arguments. Scoped host-tool patch permits2GiB and disables watchdogd only in fresh RAM Data. Ordinary artifacts, no probes/QEMU/firmware build or phone access.", "2026-11-20 mount-v11 complete: payload-only CI44616733365 SUCCESS; existing v10 kernel SHA256bac7ef5ea50ecbb22767755d26b560dd7de220a95998fa09e31e3c4f4f5d5835 byte-identical in new ESP. Actual2GiB seed imported and volatile sector written/read with production SparseDisk.h under ASan/UBSan.13 APFS superblock checksums and actual48D8 volumeUUID verified; watchdogd disable plist present. APFS shim and absentd SHA256/4K CodeDirectories/code-slot hashes match added owner trust; original Apple trust modules byte-identical. ADT4GiB owned memory, maxvnodes66560 and all five new arguments verified. Single800MiB4Kn esp.img SHA256dd5983250f0529cfbdbb8f7aba96bd44941ef3b5f25068b42fc01d9367c807f3. No XNU/firmware compile, QEMU or device access. Hardware mount-phase outcome pending."]
