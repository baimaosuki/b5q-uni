findings = ["v30 restores the b5q UFSDxe PE32 from v8 for physical ESP boot and keeps the eleven firmware USB modules out of dispatch. UniXNURamDiskDxe links UefiDecompressLib directly. ReadyToBoot reports one memory map summary.", "v29 CI 44985774704 built both images. On the phone, BDS found no EFI Simple File System handles before filtering for USB. The packed RAM FAT boot path failed before XNU. The exact RAM disk failure stage is unknown.", "v29 packaging carries the existing v28 USB DMA firmware and a DarwinBoot PE extracted from its FV.", "CI 44983031320 produced the verified FD with B5qHandoffDxe and DarwinBoot and without vendor USB or UFS dispatch. Checked 54 compiled DXE dependency expressions and the pinned HAL identity.", "B5qHandoffDxe owns USB0 Stage-1 WB/IS through the pinned Qualcomm HAL and retains its own reserved translation tables. DarwinBoot checks the final memory map before writing the ready flag. HAL default allocation uses BootServicesData.", "v27 CI 44980608285 completed. Actual ESP SHA256 f7cacbc026f765514262d62d634a49af6526167350e16a15bcf966f7604c446a. Target object, PAC, FAT, 4Kn, Data reuse and retained archive members verified. Firmware DMA ownership and physical v27 touch and USB stage results pending.", "v27 disassembly confirms all 15 HAL entries and stock USB0 bypass setup. Selected UsbConfig skips EBS detach and can lose its private handle while domain delete returns 22. Firmware owner must quiesce and retire its domain before exclusive translated attach and preserve it across EBS. XNU checks a structured ADT record and does not arm USB DMA or source VBUS without success.", "2026-11-22 v26CI44937931538SUCCESS. Actual4returnedXcodeobjects/relinkonly; v24core88703fdc/GPUarchive/addon/4GiBData/trust/menu/DarwinBoot unchanged, v25CpuFreqProbe byteidentical. Final800MiB4KnESP SHA1cc8e24241b05aa91d1bfc7d9580453e0e3f32f645123f2f2d0105e4afcf5dbd;949Bargs/2BGRA/8E-Pattrs/FATmembers/POST/APFSaccounts/watchdogd/signatures/PAC85typedGENIcall