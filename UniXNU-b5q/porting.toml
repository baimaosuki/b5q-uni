 boot image creation.", "2026-11-19: Official package --check rerun with Samsung inputs available: 130 patches listed, none applied or compiled by that check. The prior full build remains blocked by missing /opt/unixnu-linux/llvm/bin/clang; no new full build ran for this input-inventory request.", "Existing UniversalMac_27.3_26C5035r_Restore.ipsw is present in nabu_macos/out/downloads. macOS-specific SDK/Data seed/Metal addon steps follow the official Mac+Xcode workflow; Linux XNU tools alone do not satisfy them.", "The final deliverable must include separate userdata root-window assembly and policy/layout evidence in addition to kernel, payload, boot and package.manifest.json. Platform seed, runtime board evidence and deployment geometry remain unresolved; no b5q macOS artifacts are claimed.", "2026-11-19: User authorized direct GitHub Actions execution. The new root workflow uses the pinned official macos-26/Xcode flow for the full selected b5q kernel; it does not require the local Linux root installer. Workflow/run outcomes are recorded in reports/ci-stage123.json; dispatch is not itself a build success.", "2026-11-19 CI: source configuration published as 2ae6320faf10534ce17203b7efd7a21febfd32fa. API workflow_dispatch returned HTTP 403; use the repository standard push event with the existing authorized SSH push transport. No remote build result is claimed yet.", "2026-11-19 CI run 44390948642 verified macos-26/Xcode tools and resolved the full b5q target, then failed at the actual kernel build step. Log-archive API access returned HTTP 403; the workflow now captures console output and publishes sanitized failure annotations so the real source/host error can be inspected without claiming a cause from the step name.", "2026-11-19 CI run 44391906629 identified the first actual failure: the generic SoC native-smp-secondary.patch still targets the old board_config.h context. board.toml now selects the official soc:patches/xnu-12377/series. A compiler-independent check applied all 130 patches, in order, to a disposable clone of pinned XNU ac9718fb1af618d5ce8678d0dc6e8a58f252216f: PASS; this is patch application, not a kernel build success.", "2026-11-19 source integration: dts/b5q.dts compiles with the pinned SM8550 DTSI and exports GPU/GMU/SMMU ADT names while keeping UFS disabled. Only confirmed Samsung reservations are listed; runtime DRAM, remaining UH/RKP reservations and live framebuffer stay unknown. The official payload panic_screen entry-probe path is selected, but not claimed executed without a compiled/prelinked kernel.", "2026-11-19 CI run 44392851424 passed the corrected 130-patch sequence and restored five verified public headers. Bootstrap compilation entered libdispatch/libfirehose_kernel and then failed; the long check annotation was truncated, so diagnostics now extract short source-error lines from the nested logs. No compiler error is guessed from a truncated command line.", "2026-11-19: The b5q-only UEFI patch passes git apply --check against the exact baseline archive, and scripts/check-b5q-uefi.py passes required-module and excluded-dispatch checks. Firmware preflight is now independent of payload seed/GPU input checks. CI adds a separate Ubuntu firmware compilation job with matching Clang/LLD 18; this is an actual build attempt, not a claim of successful runtime handoff.", "2026-11-19 CI run 44398657089 built/installed libfirehose_kernel and stopped at the explicit RamBlock/AES closure guard. The board had overridden the OS profile prelinked crypto bootstrap with source and omitted the selected SoftwareAES personality. Remove that board override and enable XNU_NATIVE_AES; keep the full component list and all upstream guards. This config repair does not claim the macOS AES ABI or RamBlock runtime closure qualified.", "2026-11-19: User extended scope through root-storage milestone 4, following completion of the environment/UEFI/kernel milestones and the unchanged RamBlock-before-UFS gate. UEFI compilation reached actual Clang invocations but failed; a dedicated firmware workflow isolates diagnostic repairs from long kernel builds. Its filter no longer mistakes -Werror command flags for errors.", "2026-11-19 local single-module compiler check found raw libfdt calls unsupported by the selected EDK II FdtLib. B5qHandoffDxe now uses the correct Fdt* wrapper interface and builds to an AARCH64 EFI module successfully with Clang 17. The local EDK II revision and EFI hash are recorded separately from the pinned full-CI baseline; this is not a full-FD or hardware success.", "Round 1 adds official payload.build and pipeline.write_manifest integration for only kernel.macho/payload.img, plus real FAT member and packed APFS checks. A fresh local-to-build namespace seed is never printed. Existing firmware/menu is not rebuilt. CI result transfer uses recipient RSA encryption, AES-CTR and HMAC before posting ciphertext chunks to the scoped Checks API; local roundtrip/authentication passed and the private key remains ignored with mode 0600.", "2026-11-19 FINAL: CI 44455422555 at 0b8712cdc3508099a276bdb57f842ae4ca8fbeba completed SUCCESS for the user narrowed kernel+RamBlock payload scope. Authenticated encrypted download returned 22 real files with all transfer SHA256/HMAC checks PASS. Local verification independently matched original compiled kernel, FAT image and official package manifest hashes; extracted deployment kernel/ADT/RAM seed match payload.json. Packaged panic probe kernel already has the correct deterministic source POST seal. Delivery paths/sizes/SHA256 are in reports/ram-only-build-success.json. No boot or firmware build was part of this final scope. No complete system root, GPU-addon or desktop/runtime success is claimed.", "2026-11-19 new user scope: independently re-extract the original 26C5035r IPSW into artifacts/b5q-full-27.3-26C5035r using pinned upstream identity/member extraction. Fresh pinned ipsw 3.1.739 host tool download and upstream UDIF decoder are selected; no NABU decoded assets or root image are reused. Final complete-boot package status must depend on actual storage, Data UUID, policy and payload integration, not file presence.", "2026-11-19: fresh original IPSW extraction and Linux ipsw AEA decryption completed independently. OS, SystemOS, App raw image SHA256 exactly match all three official profile pins; original kernelcache independently decompressed with pinned Apple lzfse and exact profile hash. Real RSA3072 signatures and every block verified by unchanged C VerifiedRoot provider. Unchanged official userdata.build assembles SHNGROOT v2 into a host file retargeted only by supplied macosroot capacity: 17603493888 bytes. All six manifest entries/digests/bounds independently rechecked. Upstream fastboot userdata command is provenance only, removed from deliverable report. Actual template-derived Data creation uses a separate macOS CI workflow and recipient-encrypted return; existing RAM-only build is skipped only for explicit [seed-only] commit. This does not bind new policies/Data into the old kernel or implement root reads.", "2026-11-19: macOS CI 44482188463 completed SUCCESS with pinned official make-macos-data-seed.py. New Data is derived from original OS Templates/Data with root ownership preserved; logical 29GiB follows upstream auto_gib(48GiB, actual root bytes, default reserve). Actual packed 21581984-byte seed SHA256 93f9b069dbd573f1f9af39949a23fc8cda36cd8122626eb1931460e9d1b98a03 returned encrypted and independently checked for size/hash/packed logical size/APFS UUID. No arbitrary account, password, auto-login or Setup bypass was introduced. Assembly output plus policy/trust/seed/menu inputs are staged under artifacts/b5q-full-27.3-26C5035r/delivery with per-file checksums and an explicit false complete_flash_package status. Existing test kernel does not bind this new Data UUID or policy anchor; final complete-boot package is not achieved.", "2026-11-19: final staging tar.zst decompressed and every