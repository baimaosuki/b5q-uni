findings = ["The inventory script parses local FDT properties without accessing the phone or UFS partitions and does not export /chosen/bootargs. The full hardware comparison and real first-failure/retry report are preserved alongside it. Parsed memory tuples and UH guest reg were cross-checked against fdtget successfully.", "The inspected TWRP prebuilt contains four SoC DTBs; these are not a local phone extraction or an independently verified b5q board overlay.", "xnu-panic-screen.c is in UniXNU/scripts; entry probe and macOS display recipes require later board wiring and are not claimed present in this port.", "2026-11-19: Firmware, DT and GPU inventory scripts preserve member provenance and hashes, suppress full chosen/identity fields and never execute phone I/O. DT merge scope is explicitly five base0 candidates and caches are bound to recorded input/output hashes.", "The dated plan records current input/build status and the RamBlock-versus-root distinction. Main-screen entry/panic integration remains pending and is not validated by the TWRP display tests.", "2026-11-19 validation: three inventory scripts pass py_compile; all eight GPU hashes and ZAP segment checks pass; four bases/five overlays/five hash-bound cached merges and DT cross-checks pass. Porting record validates 14 areas. Input preflight remains expected-blocked solely on missing local platform seed.", "2026-11-19: User authorized direct GitHub Actions execution. The new root workflow uses the pinned official macos-26/Xcode flow for the full selected b5q kernel; it does not require the local Linux root installer. Workflow/run outcomes are recorded in reports/ci-stage123.json; dispatch is not itself a build success.", "2026-11-19 CI: source configuration published as 2ae6320faf10534ce17203b7efd7a21febfd32fa. API workflow_dispatch returned HTTP 403; use the repository standard push event with the existing authorized SSH push transport. No remote build result is claimed yet.", "2026-11-19 CI run 44390948642 verified macos-26/Xcode tools and resolved the full b5q target, then failed at the actual kernel build step. Log-archive API access returned HTTP 403; the workflow now captures console output and publishes sanitized failure annotations so the real source/host error can be inspected without claiming a cause from the step name.", "2026-11-19 CI run 44391906629 identified the first actual failure: the generic SoC native-smp-secondary.patch still targets the old board_config.h context. board.toml now selects the official soc:patches/xnu-12377/series. A compiler-independent check applied all 130 patches, in order, to a disposable clone of pinned XNU ac9718fb1af618d5ce8678d0dc6e8a58f252216f: PASS; this is patch application, not a kernel build success.", "2026-11-19 source integration: dts/b5q.dts compiles with the pinned SM8550 DTSI and exports GPU/GMU/SMMU ADT names while keeping UFS disabled. Only confirmed Samsung reservations are listed; runtime DRAM, remaining UH/RKP reservations and live framebuffer stay unknown. The official payload panic_screen entry-probe path is selected, but not claimed executed without a compiled/prelinked kernel.", "2026-11-19 CI run 44392851424 passed the corrected 130-patch sequence and restored five verified public headers. Bootstrap compilation entered libdispatch/libfirehose_kernel and then failed; the long check annotation was truncated, so diagnostics now extract short source-error lines from the nested logs. No compiler error is guessed from a truncated command line.", "2026-11-19 UEFI source work: b5q DSC/FDF now wires UniXNU, UniXNUDxe, DarwinBoot and UniXNURamDiskDxe, with B5qHandoffDxe read-only runtime FDT/reservations/EFI-map/GOP diagnostics. Explicit UFSDxe/Sdcc/mass-storage/PIL modules and automatic RamManager expansion are removed from b5q dispatch lists. The reproducible patch is recorded in stage123-source-checks.json; no firmware compile, vendor internal-I/O audit, Samsung guard completion or runtime result is claimed.", "2026-11-19: The b5q-only UEFI patch passes git apply --check against the exact baseline archive, and scripts/check-b5q-uefi.py passes required-module and excluded-dispatch checks. Firmware preflight is now independent of payload seed/GPU input checks. CI adds a separate Ubuntu firmware compilation job with matching Clang/LLD 18; this is an actual build attempt, not a claim of successful runtime handoff.", "2026-11-19 CI run 44398657089 built/installed libfirehose_kernel and stopped at the explicit RamBlock/AES closure guard. The board had overridden the OS profile prelinked crypto bootstrap with source and omitted the selected SoftwareAES personality. Remove that board override and enable XNU_NATIVE_AES; keep the full component list and all upstream guards. This config repair does not claim the macOS AES ABI or RamBlock runtime closure qualified.", "2026-11-19: User extended scope through root-storage milestone 4, following completion of the environment/UEFI/kernel milestones and the unchanged RamBlock-before-UFS gate. UEFI compilation reached actual Clang invocations but failed; a dedicated firmware workflow isolates diagnostic repairs from long kernel builds. Its filter no longer mistakes -Werror command flags for errors.", "2026-11-19 local single-module compiler check found raw libfdt calls unsupported by the selected EDK II FdtLib. B5qHandoffDxe now uses the correct Fdt* wrapper interface and builds to an AARCH64 EFI module successfully with Clang 17. The local EDK II revision and EFI hash are recorded separately from the pinned full-CI baseline; this is not a full-FD or hardware success.", "2026-11-19: CI 44408313251 compiled the b5q GOP/AES archive recipe and reached the actual final arm64e kernel linker, which failed with unresolved symbols. Added a read-only scoped Actions diagnostic job to inspect the existing text artifact and emit the exact symbol set without repeating the long build; no linker success is claimed.", "Existing-run artifact retrieval reached a signed object-storage redirect but failed HTTP 401 because urllib forwards GitHub Authorization. The diagnostic downloader now follows only official HTTPS artifact hosts without forwarding that header, and reports sanitized exceptions as annotations. No signed URLs or credentials are persisted.", "2026-11-19: scoped retrieval succeeded in run 44411680418. Its first symbol union also included bootstrap diagnostics from the console; extraction is corrected to the final kernel.log and its last Undefined symbols block only, so resolved bootstrap imports are not misreported as final failures.", "2026-11-19: diagnostic run 44412030927 successfully extracts only the final kernel.log unresolved block. The main build workflow now emits that exact block on future failures, avoiding repeat downloads or mixing bootstrap-only errors. This identifies source integration still required; no empty drivers or kernel/payload success are supplied.", "Current baseline full failure log is retrieved by a read-only Actions job using its scoped identity and returned encrypted to the local recipient. Future compile rounds publish full actual logs or real outputs using the same authenticated encrypted relay. This avoids the supplied PAT actions-scope limitation without requesting another token or publishing payload identity data.", "Round 4 CI 44452872414 successfully emits the actual 142966784-byte macOS kernel.macho with complete mapping and no missing references; downloaded encrypted outputs validate. Payload fails after panic-screen patch invocation, while the prior kernel-only error filter omits its console. Read-only diagnostic job now retrieves the complete failed-job log ZIP for that same run and relays it, without repeating the native build or guessing the payload cause.", "2026-11-19: round4 actual full kernel.macho passes complete prelink and HMAC checks, with no undefined symbols. The official payload probe failed because llvm-nm returns no top-level fileset symbols, then fixed entry-relative MMU guesses and legacy panic padding were invalid for this source layout. Device override reads only relocated non-STAB N_SECT entries from com.apple.kernel and uses verified zero entry padding compactly. All original instruction/sequence/cave/panic guards remain; actual returned kernel patch and post-patch source POST sealing PASS locally. Negative MMU/cave mutations are rejected without modifying the file. This is binary preflight, not hardware qualification.", "2026-11-19 FINAL: guarded fileset symbol extraction and compact verified entry padding passed actual macOS CI payload construction and local POST-seal idempotence verification. No final unresolved symbols remain; complete prelink mapping has no missing entries and allow_missing=false. Fresh 512MiB logical APFS RAM Data is packed into five regions, not a reused system Data seed. All original panic and crypto checks remain enabled."]
