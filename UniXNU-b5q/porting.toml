findings = ["The reference b5q FDT has eight /memory/reg tuples; they are OS-visible fragments, not one contiguous allocatable range.", "UH guest 0xb1000000+0x3000000 and UH heap 0xb0200000+0x40000 occur in the Samsung FDT; Gunyah HYP is 0x80000000+0xa00000.", "QTEE is 0xd8300000+0x500000. No separately named RKP interval was found, and none was invented.", "The eventual XNU DTS and DarwinBoot window must be constructed from b5q evidence, not the sheng memory window.", "2026-11-19: All five inspected base0+overlay candidates have /memory/reg=<0 0> and no simple-framebuffer node; the eight memory tuples in the older reference inventory are not runtime banks extracted from this phone.", "The original-package candidates show HYP 0x80000000+0xa00000, TZ-stat 0x82700000+0x100000 and QTEE 0xd8300000+0x500000. No directly adoptable separately named UH/RKP interval was established; old reference UH values must not be promoted to runtime evidence.", "Four SoC bases and five B5Q revisions 04/05/07/09/11 were preserved. Only base0 x five overlays were merged successfully; this is neither hardware selection nor a verified 20-way matrix. Cached merges now require recorded base, overlay and merged SHA256 matches.", "2026-11-19 source integration: dts/b5q.dts compiles with the pinned SM8550 DTSI and exports GPU/GMU/SMMU ADT names while keeping UFS disabled. Only confirmed Samsung reservations are listed; runtime DRAM, remaining UH/RKP reservations and live framebuffer stay unknown. The official payload panic_screen entry-probe path is selected, but not claimed executed without a compiled/prelinked kernel.", "2026-11-19 UEFI source work: b5q DSC/FDF now wires UniXNU, UniXNUDxe, DarwinBoot and UniXNURamDiskDxe, with B5qHandoffDxe read-only runtime FDT/reservations/EFI-map/GOP diagnostics. Explicit UFSDxe/Sdcc/mass-storage/PIL modules and automatic RamManager expansion are removed from b5q dispatch lists. The reproducible patch is recorded in stage123-source-checks.json; no firmware compile, vendor internal-I/O audit, Samsung guard completion or runtime result is claimed.", "2026-11-19: Added collect-runtime-fdt.py to emit only hardware memory/reg, reserved-memory and memreserve facts. It uses adb exec-out cat /sys/firmware/fdt without block-device access, keeps raw FDT only in a temporary file, and emits no chosen/bootargs/serial/seed. Offline smoke input is explicitly labelled offline and correctly reports no nonzero memory bank; it is not a phone capture or a GOP observation.", "2026-11-19: the attached recovery identifies as nabu (Xiaomi Pad 5), not b5q. An initial read-only non-b5q capture was quarantined under ignored artifacts/non-b5q-rejected and never used as b5q evidence. The collector now checks b5q/SM-F731 before FDT capture. Its offline check against official Samsung base0+overlay0 reads /memory reg as zero/zero and 68 reserved nodes, demonstrating why static DT is insufficient; EFI GOP/map remain unknown.", "Compile-only payload preserves the Samsung static zero/zero memory placeholder in a correctly typed memory node. The actual ADT serializer was executed successfully (16272 bytes), with PackedRAMDisk handoff. DarwinBoot derives PhysicalBase/MemorySize from EFI allocation; no Samsung DRAM address or size is fabricated and no recovery capture is requested."]
