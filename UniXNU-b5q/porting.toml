[[area]]
id = "recovery-display"
status = "implemented"
components = []
paths = ["reports/twrp-cover-off.json"]
inputs = ["Pinned b5q TWRP device tree, Samsung SM8550 common tree and minuitwrp DRM backend; b5q main display is 1080x2640."]
configuration = ["The b5q-only v4 policy enables atomic capabilities before querying ownership, verifies main atomic CRTC_ID/ACTIVE, filters main/cover planes by mask/format/ownership, and tests compatible cover candidates before real commits. No pre-test off/DPMS or observer sysfs writes remain. The main brightness path is fixed to a real positive-max node, with explicit power-unblank for positive brightness requests."]
procedure = ["Build recoveryimage with the cover-off patches, then inspect the final ramdisk and compare kernel/DTB/DTBO to the previous build."]
findings = ["The original non-main CRTC teardown submitted a secondary ACTIVE property against main_monitor_crtc and ran before atomic capabilities were enabled.", "The new policy resolves object-local properties, tears down only the assigned cover CRTC and planes, avoids shared/main CRTCs and has DPMS fallback.", "Samsung's legacy panel1 backlight alias can have NULL ops; the service targets the Qualcomm panel1-backlight path only and retries late registration.", "The latest user authorized a TWRP cover-display build; this work does not complete the macOS display port or change the bootloader warning stage.", "The recoveryimage build and final-image inspection passed; 14 DRM mock scenarios with ASan/UBSan and five shell-helper tests passed. Incremental relink staging stamps are refreshed to prevent a stale library in the ramdisk.", "Delivered v1 recovery.img SHA256: a05be4db7e1d5fdd340b4f1f25d29c3c80a081ee3826c27cfe3a0d44c654774d; kernel/DTB/DTBO unchanged from the baseline.", "2026-11-19: user reports v1 did not darken the physical cover display; mock/image PASS was not hardware success. Reworking inherited-splash takeover, power requests and persistent diagnostics as v2. The inspected sde_connector.c caches brightness while allow_bl_update is false; its panel number is a registration counter, not a proven physical display identity.", "2026-11-19: v2 recoveryimage built successfully; 14 off-policy + 32 takeover + 7 helper tests passed (53 total); final ramdisk includes takeover, fallback and diagnostic service. SHA256 482eb45f19a16a92cf440000efee01f3254a0a9de48e0bc4868f8597c61fed76. Kernel/DTB/DTBO unchanged. No physical v2 success is claimed.", "2026-11-19 user-supplied excerpts verify v2 is installed and its black TEST_ONLY failed with -22/EINVAL; snapshots later show all CRTCs disconnected and both real backlights in powerdown. Exact pre-off CRTC ownership and cause of SDE_0 shutdown are not established from the excerpts alone. Removing all pre-test cover-off/DPMS calls, guarding main ownership using atomic CRTC_ID, and testing alternative compatible resources as v3. Full logs are referenced on a separate Windows host and have not been read locally.", "v3 built and final-image checks passed, including absence of the legacy pre-test teardown string, presence of read-only observer and compiled real-node brightness guards. 49 v3 + 7 observer + 14 historical tests passed (70 total). IMG SHA256 b1076392b3db80863a937a99fb6a3f3ac84d86ae6a80d7cb26c61af44b1b6c5b. Kernel/DTB/DTBO unchanged; hardware not tested.", "User reports v3 remains on the inner Samsung logo. Local ADB has no device; no v3 runtime log is available. Code audit found atomic connector ownership queried before drmSetClientCap(ATOMIC), so an invisible CRTC_ID can make main initialization fail. v4 moves capability setup before all main ownership queries and covers bootloader scanout handoff in host regressions.", "v4 recoveryimage and final image verification passed. 53 native + 8 observer/source-order + 14 historical host cases passed (75 total). IMG SHA256 ac5e72f99b97cb1098ed5b5fad227cca02c043ff54d3e18e74c4e0c7f48da854. The original kernel/DTB/DTBO are unchanged; actual v4 boot/display remains unverified."]
completion = ["The recoveryimage build and host policy tests pass, and the final ramdisk contains the board init service and compiled DRM policy. Actual cover power-off requires a separate device observation."]
limits = ["No connected ADB device was present; runtime panel state is not yet verified."]
next_action = ["Deliver v4 standalone IMG; first verify recovery is reachable and the inner UI replaces the logo. On the connected computer, adb get-state and ro.twrp.version distinguish userspace availability; inspect B5Q-COVER4 early caps/main/graphics logs before further changes."]

