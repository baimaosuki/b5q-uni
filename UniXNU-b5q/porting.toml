inputs = ["Pinned UniXNU/macOS profiles and b5q source evidence listed below."]
configuration = ["board.toml and reports/hardware-baseline.json carry effective selection and observed facts."]
procedure = ["Use the official package.sh entry point and record the first real failure without marking subsequent steps complete."]
findings = ["The board uses Format 2 and selects the 13 requested catalog components for macos-27.3-26C5035r. Official package --check passed with 130 listed patches; listing does not apply them or run firmware preflight.", "scripts/package.sh is the unmodified upstream template. Bare --os 27 selects iPadOS, so the full macOS profile is used.", "The user replaced the Stage 1 confirmation gate with continuous implementation authorization; unavailable external inputs must be reported.", "2026-11-19: The supplied SM-F7310 CHC Android 15 package F7310ZCS7EYF3 was inventoried; the continuous porting plan separates input availability, host builds and device acceptance without changing component selection.", "The original firmware directory and RAR archives are ignored to avoid accidental binary publication; ignored local.toml now points at the extracted Samsung GPU directory.", "2026-11-19: User authorized direct GitHub Actions execution. The new root workflow uses the pinned official macos-26/Xcode flow for the full selected b5q kernel; it does not require the local Linux root installer. Workflow/run outcomes are recorded in reports/ci-stage123.json; dispatch is not itself a build success.", "2026-11-19 CI: source configuration published as 2ae6320faf10534ce17203b7efd7a21febfd32fa. API workflow_dispatch returned HTTP 403; use the repository standard push event with the existing authorized SSH push transport. No remote build result is claimed yet.", "2026-11-19 CI run 44390948642 verified macos-26/Xcode tools and resolved the full b5q target, then failed at the actual kernel build step. Log-archive API access returned HTTP 403; the workflow now captures console output and publishes sanitized failure annotations so the real source/host error can be inspected without claiming a cause from the step name.", "2026-11-19 CI run 44391906629 identified the first actual failure: the generic SoC native-smp-secondary.patch still targets the old board_config.h context. board.toml now selects the official soc:patches/xnu-12377/series. A compiler-independent check applied all 130 patches, in order, to a disposable clone of pinned XNU ac9718fb1af618d5ce8678d0dc6e8a58f252216f: PASS; this is patch application, not a kernel build success.", "2026-11-19 source integration: dts/b5q.dts compiles with the pinned SM8550 DTSI and exports GPU/GMU/SMMU ADT names while keeping UFS disabled. Only confirmed Samsung reservations are listed; runtime DRAM, remaining UH/RKP reservations and live framebuffer stay unknown. The official payload panic_screen entry-probe path is selected, but not claimed executed without a compiled/prelinked kernel.", "2026-11-19 CI run 44392851424 passed the corrected 130-patch sequence and restored five verified public headers. Bootstrap compilation entered libdispatch/libfirehose_kernel and then failed; the long check annotation was truncated, so diagnostics now extract short source-error lines from the nested logs. No compiler error is guessed from a truncated command line.", "2026-11-19: The b5q-only UEFI patch passes git apply --check against the exact baseline archive, and scripts/check-b5q-uefi.py passes required-module and excluded-dispatch checks. Firmware preflight is now independent of payload seed/GPU input checks. CI adds a separate Ubuntu firmware compilation job with matching Clang/LLD 18; this is an actual build attempt, not a claim of successful runtime handoff.", "2026-11-19 CI run 44398657089 built/installed libfirehose_kernel and stopped at the explicit RamBlock/AES closure guard. The board had overridden the OS profile prelinked crypto bootstrap with source and omitted the selected SoftwareAES personality. Remove that board override and enable XNU_NATIVE_AES; keep the full component list and all upstream guards. This config repair does not claim the macOS AES ABI or RamBlock runtime closure qualified.", "2026-11-19: exact final-link diagnostics contain unresolved original-storage ABI, Adreno implementation/glue, optional board hooks and source-provider crypto hooks. Added a target-specific source patch for the prelinked crypto mismatch only: prng_random already undefines XNU_SOURCE_CORECRYPTO14 in prelinked mode, so OSKext must not call those absent source-only functions. The original kext startfunc and security-policy registration are unchanged, with no POST bypass or substitute crypto callbacks. All 131 patches apply in order; target link retry pending.", "2026-11-19 user narrowed the task to actual macOS kernel/payload/manifest build closure, authorizing explicit missing-board stubs and pausing every UFS controller task. Baseline run 44412976670 was watched to completed/failure. Round 1 changes address the complete storage/GPU/board-hook groups together, not one-symbol CI pushes. The existing 13-component selection remains; catalog embedded providers now build the full actual source closure.", "RAM-only round 2 CI 44449322719 reaches a successful native arm64e XNU link: actual downloaded kernel.log has no final undefined block, and all real storage/GOP/Adreno recipes pass. Prelink then stops at the required reviewed-site symbol unixnu_kernel_stack_shift. Round 3 extracts only the OS-generic osfmk/kern/stack.c alignment hunk from pinned reference bring-up: defines the real shift from stack allocation alignment and includes guard pages; no board constants, scheduler bypasses or sandbox changes are included. All 132 patches apply in order.", "Round 3 CI 44450700994 has no final linker undefined symbols and supplies the real stack-shift variable. Prelink now rejects one dynamic chained import: native_pmap_user_mappings is already defined locally as a weak fallback but was not hidden. Mark all absent-provider weak definitions hidden as the upstream source-storage weak-default contract requires. A local exact-symbol diagnostic rebase of that one import exposes the next error: native __fips_hmacs absent under prelinked bootstrap. Production fix is NOT to bypass the seal: align with sheng source-storage configuration (source crypto bootstrap; late ABI-qualified AES instead of early personality), so the real corecrypto bootstrap/POST/HMAC are linked and retained-original initialization stays once-only. Remove the superseded prelinked-hook patch from selection."]
completion = ["The subsystem implementation and required host checks pass; device claims require a separate recorded device result."]
limits = ["No Flip5 macOS hardware qualification or full kernel/payload/boot build is recorded."]
next_action = ["Follow the dated plan: finish environment and b5q board integration using the inventoried Samsung inputs."]

