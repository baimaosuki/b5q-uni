21 v20final: CI44815916915SUCCESS at29b28ff4;exactv19GPU/Homebrewcachehits.3boardobjects compiled,149994648B XNUcorearchiveSHA1fce36d7ee6c79cb2b1aca01b3635cdda568c8dadef6a5c3490007610a3a3d3b unchanged.7rules,46nativeBGRAcases,427slotactualABI,USBcompiledentry reachingcoremap,logger/read/POST/APFS/signature/trust/FAT checksPASS. Data/addon/fullownertrust byte-identicalv19. Single800MiB4KnESP SHAea3fabf357d1ef6adc6d8b642e4ec74a259e5bfd0797bdb0255244b5ccbe779d. v20physicaldisplay/USB resultpending;no phone writes.", "2026-11-21 v20: Restore user-specified7qualified26C5035r text rules and fb-half=2,retaining hardwareMetal flags.", "XNU2LOG-v12 complete: CI44626576574 SUCCESS at dfe020141aa42aaf03da15c2c89c502e3cb376c5 with latest core8542980 and Shengc8f92b20 generic runtime alignment. Actual ESP-extracted kernel has inline console-ring stores, serial/panic capture calls, TryLock and WRITE10/SYNC10. Compiled public lockdown handler executed with8-byte0/1 state and error propagation (locks/copyout/PAuth mocked).13 APFS checksums, original trust and signed shim preserved; v11 2GiB seed byte-identical. New800MiB4Kn ESP journal contiguous2051clusters, dualFAT/noaliases/tokenCRC proven. ESP SHA256226cefe802f13751a62d88aaa9ed7b14104c239e4a59ab4ac4d1607293c7d1a4. No hardware boot/writer result or direct flashing claimed; halted CPUs may lose last uncommitted snapshot.", "2026-11-20 user latest main alignment: live UniXNU-sheng main remains c8f92b208068eeaa4cd2b0f592671f04ee70076e; all shared lock commits match. Core build pin advanced to8542980d02b4d2cc5c32ee3542de1760b2562aac (only device docs/catalog since old pin). Adopted generic dyld16K-on4K fixups/source release, bindfs file-ID resolution and hw.pagesize access. Added native-state public lockdown sysctl uint64 and explicit cs-lazy/boot-payload-release/exec-log with vmm-present u32. Photo proves PID1 SIGABRT and15.4MB free pages, not its userspace call chain; NABU matching failure is reference evidence. Device hardware ta