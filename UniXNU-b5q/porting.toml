ESP. Actual2GiB seed imported and volatile sector written/read with production SparseDisk.h under ASan/UBSan.13 APFS superblock checksums and actual48D8 volumeUUID verified; watchdogd disable plist present. APFS shim and absentd SHA256/4K CodeDirectories/code-slot hashes match added owner trust; original Apple trust modules byte-identical. ADT4GiB owned memory, maxvnodes66560 and all five new arguments verified. Single800MiB4Kn esp.img SHA256dd5983250f0529cfbdbb8f7aba96bd44941ef3b5f25068b42fc01d9367c807f3. No XNU/firmware compile, QEMU or device access. Hardware mount-phase outcome pending.", "2026-11-20 v14: use CRC-valid v13 log as runtime evidence and retain its proven OSLOG allocation and zero-range SYNC10 logger unchanged. Local production CPU probe and actual ARM64 launch-gate tests cover configuration fixes; no new probes/QEMU, and no inferred Metal panic or WindowServer wait stack.", "2026-11-20 v14 completion: final image retains proven v13 logger byte-for-byte; actual returned binary OSLOG/FIRST, zero-range SYNC10, bounded FUA writer and launch-policy gate verification pass. Log allocation validates continuous2051clusters, mirrored FAT and no aliases. No QEMU/device access or extra probes.", "2026-11-20 v14 runtime log seq80/96215bytes has no overwrite or lock loss; IOKit busy0 and absentd no exit are observed. No TimeSync clock or presented frames logged, but no WindowServer stack proves a unique wait. Preserve existing4MiBRAM/ESP logger and update only supported same-stage runtime inputs.", "2026-11-20 v15 delivered: final logger OSLOG/FIRST, bounded WRITE10FUA and zero-rangeSYNC10 tests passed on actual deployed kernel; full signed/trusted boot shim and five text policies verified.4MiBring retained because v14no loss/overwrite; next physical log distinguishes local clock, compositor and frame observations.", "2026-11-20 v16 source audit uses latest v14CRC-valid96215byte log; no v15physical log yet. No log loss/overwrite or new confirmed kernel panic. Preserve4MiBlog and unchanged v15clock/software policies; found source defects are host-reproduced and not asserted to be observed v14stall causes.", "2026-11-20 v16 complete:23localchecks plus actual final10case ARM64read retry verifier, exact Ethernet ABI/lifecycle, POST/trust/APFS/FAT and logger proofs PASS. New fixes are potential source-defect closures; latest actual log remainsv14 and is not evidence of a testedv15/v16desktop.", "v17 source audit: journal metadata/slot READ10 treats valid BUSY/FULL/UA/NOTREADY as bounded read-only retries(3attempts/50ms), classifies under host.lock and keeps malformed/short/permanent failures terminal. Actual production old/new replay and unchanged WRITE10FUA/SYNC10 gates pass; latest hardware log is stillv14.", "2026-11-20 v17 complete: one CI44746455235 SUCCESS source1a3cd004;25localchecks,6case actual ARM64batchdispatch/compiledblockverifier,10case readretry and existing logger/Ethernet/POST/trust/APFS/FAT proofs PASS. ESP800MiB4Kn SHA256d1ef17bd1eebde4efe8c17a948b50a18c1de093142070a4704d55a296e045371. Exact new kernel/Data staging tested for future payload-only reuse. Latest actual hardware log remainsv14; no new physical outcome claimed.", "v17journal validates bothCRCslots;slot1seq90/108331bytes,0overwritten,42byteslost on capture contention. Correct pasted no-loss/full-log assumption. Recorded5WindowServerSIGABRT exitlocations without claiming exactbackdrop assertion or no laterpanic/reboot. Logger unchanged.", "v18validlogseq88/106755bytes no loss/overwrite;32loggedcopies/10fixups thenWindowServer109SEGV/395BUS. Newbounded8capture fatalcontext uses savedPC/LR/FP/FAR/ESR,16user/16kernelframes andcache slidebeforecorpse;no guessedcrash fix or signalpolicychange.", "2026-11-21: guide-directed SM8550 correction in progress. Restore shared GMU/SMMU/command-db kit with generated b5q windows/votes. CI44780034968 stopped at usb-bindings Mach-O platform mismatch; assembly now uses kernel_target.TRIPLE, pending local source/platfo