result = "Validated the locally built firmware volume. Its SHA256 is df26529ae53be872b6c3856ab1f4fadb3c994fca8a8199c219112438783ea983. UFSDxe is byte-identical to the PE32 extracted from the v8 FD, SHA256 f33a84726dacd79bb243d4131f1ab25cf55aa686e1f980a59285bd024cc38d7a. The FV check covered 54 DEPEX expressions and the compiled ramdisk exports no EFI decompression protocol dependency. The pinned Mu DxeCore source already registers that protocol in DxeMain, so the exact v29 packed initrd failure on the phone remains unknown."

