red4096-byte sectors. All FAT members read back, fsck and real POST seal checks PASS locally. No patcher execution, CI or phone I/O.", "2026-11-20 v9: preparing one rebuilt official deployment kernel/payload and native4K 800MiB ESP IMG. All added checks run locally, followed by normal CI compilation and authenticated return; no TAR/ZIP delivery.", "2026-11-20 v9 local delivery assembler consumes authenticated CI FAT members, retains the existing EFI application/driver explicitly, verifies POST/root binding/typed ADT/FAT roundtrip, and emits only one 800MiB native4K esp.img. Temporary staging and QEMU loader files are removed; no firmware build or phone access.", "2026-11-20 latest user: disable encrypted Checks relay for subsequent runs; workflows now upload ordinary Actions artifacts with kernel/payload/manifest and log outputs. QEMU is not run for this delivery. Existing successful build outputs are being recovered without recompiling solely to change transport.", "2026-11-20 v9 delivered: CI 44598173747 kernel and official payload steps succeeded with complete mapping, no missing symbols and allow_missing=false. Legacy transport final status PATCH failed HTTP404; all 3024 existing chunks recovered and authenticated locally without rebuilding. ESP800MiB/S4096/s1 SHA256 700af2c8e87b412581190af8e38e23c5993bec244e6c65ce80d32e5815f82f09. Actual ESP-extracted deployment kernel confirms 47-bit user VA and console call; POST and every FAT member roundtrip pass. No QEMU run per latest user; device runtime remains pending.", "2026-11-20 v10: user photo symbolizes to the selectLun failure, not the former apps_smmu exception. Auditing missing standard UFS device wake/TEST UNIT READY, CHECK CONDITION residual handling, detailed per-LUN/GPT rejection and every signed-root boundary. Observed OCS/type do not establish SCSI GOOD or actual Samsung power mode. Standard UFS protocol helpers added; no Xiaomi board constants, SMMU changes or persistent writes.", "2026-11-20 v10 implem