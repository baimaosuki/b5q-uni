procedure = ["Use the official package.sh entry point and record the first real failure without marking subsequent steps complete."]
findings = ["An independent uefi-b5q checkout was created at b303410c8e401fc9419ae65a024356ed09a438ef; source-alignment.json records it separately. No b5q SEC/guard/watchdog merge is claimed.", "Historical 2026-11-18 filename search found no Samsung firmware at that time (reports/build-attempt.json). Superseded by the user-provided F7310ZCS7EYF3 directory and the 2026-11-19 extraction evidence below; no Xiaomi firmware was substituted.", "The inherited Samsung platform selects vendor hardware drivers; its UFS dispatch needs an explicit RamBlock-only policy before a new firmware build.", "2026-11-19: Extracted only boot, vendor_boot, recovery, dtbo, super and NON-HLOS from the supplied package; no protected bootloader members were extracted and no phone partitions were accessed. The allowlist extractor records member offsets and compressed/uncompressed SHA256.", "Original vendor_boot/recovery DTB bundles match; recovery_dtbo equals the effective AP DTBO table prefix. Samsung GPU files are in super/vendor EROFS /firmware, not NON-HLOS.", "Extracted inputs resolve the prior firmware-directory gap; Samsung SEC/UH/RKP, watchdog, GOP and continuous-memory integration are not implemented.", "2026-11-19: User authorized direct GitHub Actions execution. The new root workflow uses the pinned official macos-26/Xcode flow for the full selected b5q kernel; it does not require the local Linux root installer. Workflow/run outcomes are recorded in reports/ci-stage123.json; dispatch is not itself a build success.", "2026-11-19 UEFI source work: b5q DSC/FDF now wires UniXNU, UniXNUDxe, DarwinBoot and UniXNURamDiskDxe, with B5qHandoffDxe read-only runtime FDT/reservations/EFI-map/GOP diagnostics. Explicit UFSDxe/Sdcc/mass-storage/PIL modules and automatic RamManager expansion are removed from b5q dispatch lists. The reproducible patch is recorded in stage123-source-checks.json; no firmware compile, vendor internal-I/O audit, Samsung guard completion or runtime result is claimed.", "2026-11-19: The b5q-only UEFI patch passes git apply --check against the exact baseline archive, and scripts/check-b5q-uefi.py passes required-module and excluded-dispatch checks. Firmware preflight is now independent of payload seed/GPU input checks. CI adds a separate Ubuntu firmware compilation job with matching Clang/LLD 18; this is an actual build attempt, not a claim of successful runtime handoff.", "2026-11-19: User extended scope through root-storage milestone 4, following completion of the environment/UEFI/kernel milestones and the unchanged RamBlock-before-UFS gate. UEFI compilation reached actual Clang invocations but failed; a dedicated firmware workflow isolates diagnostic repairs from long kernel builds. Its filter no longer mistakes -Werror command flags for errors.", "2026-11-19 local single-module compiler check found raw libfdt calls unsupported by the selected EDK II FdtLib. B5qHandoffDxe now uses the correct Fdt* wrapper interface and builds to an AARCH64 EFI module successfully with Clang 17. The local EDK II revision and EFI hash are recorded separately from the pinned full-CI baseline; this is not a full-FD or hardware success.", "2026-11-19: pinned full b5q firmware CI run 44402720981 (commit 076f3121a34e2e60b44ab736367dc536018b6c4b) completed SUCCESS with the upstream FD size check. This supersedes the earlier compile-failed state only; Samsung guards, validated runtime handoff and hardware remain pending."]
completion = ["The subsystem implementation and required host checks pass; device claims require a separate recorded device result."]
limits = ["No Flip5 macOS hardware qualification or full kernel/payload/boot build is recorded."]
next_action = ["Implement b5q UEFI runtime FDT/GOP inventory, Samsung handoff and RAM-payload integration; keep vendor UFS dispatch off until RamBlock passes."]

