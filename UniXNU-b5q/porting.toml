easons. Local16-check pre-CI including production protocol regression and actual root image/policy hashes PASS. Ordinary Actions artifact only; no QEMU.", "2026-11-20 v10 final: corrected READ10 source b6fd887c07b729e7e6a36d144aabe04f7648b842 compiled and packaged successfully in CI44606991063. Ordinary artifact SHA256 verified after a rejected initial digest mismatch and successful retry. Actual ESP-extracted rootRead disassembly has mov w11,#0x28 and CDB field stores; wake/ready commands and full panic diagnostic strings present. Complete prelink without missing symbols, POST idempotence, signed-root inputs, typed ADT and every FAT member roundtrip PASS. Single800MiB4Kn esp.img SHA256 8b64abce3ee1b4338d3614e8b46e82d0a2d253871b4b0869203ad78b37990087. No QEMU or device access; actual post-wake SCSI/root mount remains a device milestone.", "2026-11-20 XNU2LOG investigation: found the actual NABU NABUCFG2/NABULOG2 dual-slot kernel journal, its generator, RAM console capture, bounded ESP writer and decoder in /home/baimao/nabu_macos. Created only the requested new8400896-byte blank allocation with a fresh identity; config matches the original generator and passes production C verifier plus corruption/token negatives, both slots uncommitted and no captured log fabricated. b5q-v10 has no console-capture/logger integration or enabled persistent writes; its delivered ESP remains unchanged. Generic format reuse does not authorize copying NABU LUN0, GPT128-entry limit or hardware/partition values.", "2026-11-20 mount-v11: user reports UFS/root/launchd progress and mount-phase-1 abort. Source confirms29GiB seed writes refused by isBig&&!direct, missing runtime APFS boot shim and key-events gate. Payload-only rebuild reuses v10 kernel, requests4GiB owned memory, builds2GiB volatile Data with actual compiled48D8 UUID (attachment48D0 is wrong), adds typed maxvnodes and documented startup arguments. Scoped host-tool patch permits2GiB and disables watchdogd only in fresh RAM Data.