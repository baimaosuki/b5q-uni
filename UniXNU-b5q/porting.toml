es66/69/25+168orderedQMP+1sIRQfuse integrated. Oldwarmhost/PM8550Bimplementationremoved;touch11orC1andallinputflagsenabled;982Bargs retainsvalidationdisables.140corepatches apply;newcore/4GiBseed/800MiB4KnESPfullCIprepared;GPU/archive/addon/cachesreuse. Exactlocalresults andsourcehashes inreports/runtime-v24.json. No currentCIbinary/hardwaresuccessclaimed.", "2026-11-21 v24 local audit update: Independent static audit located actuallocalb5q HALIOMMU15-entry interface anddynamicCBAR allocator, not a fixedUSBbank. SavedFDTonlySID40/displaySMRid1c00mask2; documentedAPIhasno bankownershipgetter. BinaryRVAs+SHA+sourceindices recorded inusb-handoff-v24.json. No currentphonefirmwareidentityverified ornewfirmwareexecuted.", "2026-11-20 actual deployed Mu source rebuilt locally in 43 seconds using Clang17 and its original Mu_Basecore revision 64f478939955e45faa632c160ae2a75a5ff7ef7f. Unpacked boot firmware contains the exact new SEC TE image and all four reserved HOB rows with correct address/size/type. The independent uefi-b5q map also receives the same source patch.", "2026-11-20: current deployed boot transport was confirmed byte-identical to the original menu-build shim+firmware hash 96e108cf9f0b1e868cf8a5fbd900a852762edd33e60be95c6b086f7207ae933d. It uses sources/Mu-Silicium with RamManagerDxe enabled, unlike the independent uefi-b5q checkout. Add b5q live high reservations to both platform maps and rebuild the actual deployment source through official UniXNU firmware helpers.", "An independent uefi-b5q checkout was created at b303410c8e401fc9419ae65a024356ed09a438ef; source-alignment.json records it separately. No b5q SEC/guard/watchdog merge is claimed.", "Historical 2026-11-18 filename search found no Samsung firmware at that time (reports/build-attempt.json). Superseded by the user-provided F7310ZCS7EYF3 directory and the 2026-11-19 extraction evidence below; no Xiaomi firmware was substituted.", "The inherited Samsung platform selects vendor hardware drivers; its UFS dispatch needs an explicit RamBlock-only policy before a new firmware build.", "2026-11-19: Extracted only boot, vendor_boot, recovery, dtbo, super and NON-HLOS from the supplied package; no protected bootloader members were extracted and no phone partitions were accessed. The allowlist extractor records member offsets and compressed/uncompressed SHA256.", "Original vendor_boot/recovery DTB bundles match; recovery_dtbo equals the effective AP DTBO table prefix. Samsung GPU files are in super/vendor EROFS /firmware, not NON-HLOS.", "Extracted inputs resolve the prior firmware-directory gap; Samsung SEC/UH/RKP, watchdog, GOP and continuous-memory integration are not implemented.", "2026-11-19: User authorized direct GitHub Actions execution. The new root workflow uses the pinned official macos-26/Xcode flow for the full selected b5q kernel; it does not require the local Linux root installer. Workflow/run outcomes are recorded in reports/ci-stage123.json; dispatch is not itself a build success.", "2026-11-19 UEFI source work: b5q DSC/FDF now wires UniXNU, UniXNUDxe, DarwinBoot and UniXNURamDiskDxe, with B5qHandoffDxe read-only runtime FDT/reservations/EFI-map/GOP diagnostics. Explicit UFSDxe/Sdcc/mass-storage/PIL modules and automatic RamManager expansion are removed from b5q dispatch lists. The reproducible patch is recorded in stage123-source-checks.json; no firmware compile, vendor internal-I/O audit, Samsung guard completion or runtime result is claimed.", "2026-11-19: The b5q-only UEFI patch passes git apply --check against the exact baseline archive, and scripts/check-b5q-uefi.py passes required-module and excluded-dispatch checks. Firmware preflight is now independent of payload seed/GPU input checks. CI adds a separate Ubuntu firmware compilation job with matching Clang/LLD 18; this is an actual build attempt, not a claim of successful runtime handoff.", "2026-11-19: User extended scope through root-storage milestone 4, following completion of the environment/UEFI/kernel milestones and the unchanged RamBlock-before-UFS gate. UEFI compilation reached actual Clang invocations but failed; a dedicated firmware workflow isolates diagnostic repairs from long kernel builds. Its filter no longer mistakes -Werror command flags for errors.", "2026-11-19 local single-module compiler check found raw libfdt calls unsupported by the selected EDK II FdtLib. B5qHandoffDxe now uses the correct Fdt* wrapper interface and builds to an AARCH64 EFI module successfully with Clang 17. The local EDK II revision and EFI hash are recorded separately from the pinned full-CI baseline; this is not a full-FD or hardware success.", "2026-11-19: pinned full b5q firmware CI run 44402720981 (commit 076f3121a34e2e60b44ab736367dc536018b6c4b) completed SUCCESS with the upstream FD size check. This supersedes the earlier compile-failed state only; Samsung guards, validated runtime handoff and hardware remain pending.", "2026-11-19: full local FD build also PASS using pinned EDK II cfb93724a06ff86ff5ba971413368a7809ee42a5 and Clang17. artifacts/b5q-stage123/firmware/SILICIUM_UEFI.fd is 3145728 bytes, SHA256 f1fa4e0e4e4f42ce5f6acb03488735abfcddadc4ecb89c76a88fe704c0f598e0. CI run 44408313388 separately passed with Clang18 and retained its own FD artifact. Not a macOS boot.img or runtime handoff result."]
completion = ["The subsystem implementation and required host checks pass; device claims require a separate recorded device result."]
