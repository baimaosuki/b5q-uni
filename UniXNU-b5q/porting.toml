findings = ["The board component list selects RamBlock and VerifiedRoot; no ShengUfs root or persistent-data arguments are enabled.", "B5qUfs is not implemented or published as a submodule. A name blacklist alone cannot prevent raw-LBA writes to protected partitions.", "efs/sec_efs/cpefs/param/xbl/abl and slot aliases remain excluded from any proposed write path.", "An existing NABU macOS 27.3 runtime/data.dbr was passed as an external candidate to the build attempt; compilation stopped before seed binding or b5q validation. Its OS, UUID and platform bindings are not claimed verified.", "2026-11-19: Static DT confirms UFS 0x1d84000+0x3000 and ICE 0x1d88000+0x8000; no controller was initialized or accessed.", "Upstream RamBlock provides writable RAM Data, not automatically OS/SystemOS/App root windows. Package.sh omits userdata assembly; root policies and userdata require their separate build step.", "After RAM I/O validation only, implement a bounded b5q UFS root-read path; distinguish controller MMIO command writes from persistent block writes. Default persistent writes stay off, protected endpoints stay inaccessible, and no deployment area or LBA is privately chosen.", "2026-11-19 source integration: dts/b5q.dts compiles with the pinned SM8550 DTSI and exports GPU/GMU/SMMU ADT names while keeping UFS disabled. Only confirmed Samsung reservations are listed; runtime DRAM, remaining UH/RKP reservations and live framebuffer stay unknown. The official payload panic_screen entry-probe path is selected, but not claimed executed without a compiled/prelinked kernel.", "2026-11-19 UEFI source work: b5q DSC/FDF now wires UniXNU, UniXNUDxe, DarwinBoot and UniXNURamDiskDxe, with B5qHandoffDxe read-only runtime FDT/reservations/EFI-map/GOP diagnostics. Explicit UFSDxe/Sdcc/mass-storage/PIL modules and automatic RamManager expansion are removed from b5q dispatch lists. The reproducible patch is recorded in stage123-source-checks.json; no firmware compile, vendor internal-I/O audit, Samsung guard completion or runtime result is claimed.", "2026-11-19 CI run 44398657089 built/installed libfirehose_kernel and stopped at the explicit RamBlock/AES closure guard. The board had overridden the OS profile prelinked crypto bootstrap with source and omitted the selected SoftwareAES personality. Remove that board override and enable XNU_NATIVE_AES; keep the full component list and all upstream guards. This config repair does not claim the macOS AES ABI or RamBlock runtime closure qualified.", "2026-11-19: User extended scope through root-storage milestone 4, following completion of the environment/UEFI/kernel milestones and the unchanged RamBlock-before-UFS gate. UEFI compilation reached actual Clang invocations but failed; a dedicated firmware workflow isolates diagnostic repairs from long kernel builds. Its filter no longer mistakes -Werror command flags for errors.", "2026-11-19: RamBlock original pinned sparse host test fails because it rejects 2GiB+4KiB while its current parser explicitly allows up to 1TiB. A disposable-test runner corrects only that negative input to 1TiB+4KiB, retaining all assertions and unmodified parser, and runs all five host suites with ASan/UBSan. Host tests do not pass the phone UFS hardware gate.", "2026-11-19: all five actual RamBlock host suites PASS with ASan/UBSan after the documented disposable negative-boundary correction. Added independent CI for the same tests and VerifiedRoot real RSA/C parser mutation tests. The pinned ShengUfs source was fetched exactly and audited: its LUN0 userdata layout, SMMU stream 0x1401, DPU takeover and physical addresses are board policy, not b5q transport evidence. None is copied or enabled; no B5qUfs hardware driver or real root mount is claimed."]
completion = ["The subsystem implementation and required host checks pass; device claims require a separate recorded device result."]
limits = ["No Flip5 macOS hardware qualification or full kernel/payload/boot build is recorded."]
next_action = ["Validate RamBlock with all UFS paths disabled; then implement bounded root reads and three verified-root windows, keeping Data in RAM initially."]

