ains unobserved.", "2026-11-19 first actual UFS CI 44487231271 reached the new source compile and reported exactly two ABI/compiler errors: mixed IOOptionBits enum OR and IOBlockStorageDevice init requires explicit OSDictionary*. Both fixed as a batch; parser narrowing warning fixed too. LUN discovery now queries read-only Unit descriptors to exclude boot-LUN units before capacity/GPT reads, and ignores devices smaller than target bounds. Original static/System/App trust bundles are freshly extracted before payload. GOP phase4 CPU display path selected, and actual EFI-owned memory request raised to2GiB to cover full verified tables and user-space needs; no physical DRAM location copied.", "2026-11-19 CI44489337860 compiled new UFS source and root-binding but stopped at B5qPmgr.cpp:30 due to forward-only IOPlatformExpert declaration; added the actual IOKit/IOPlatformExpert.h inheritance definition. Extracted the production SMMU exact-stream algorithm into B5qSmmu.h and tested actual writes with ASan/UBSan mocks: unrelated display streams/banks unchanged, masked/duplicate matches and busy banks rejected. No physical UFS result is claimed.", "2026-11-19 CI44491129022 completed all storage/PMGR/GOP/Adreno archives and reached final XNU link. Exactly one unresolved symbol remained: IOStorage::complete(IOStorageCompletion*, int, unsigned long long), called at B5qUfs.cpp in doAsyncReadWrite. Replaced that non-exported convenience wrapper with its exact public IOStorage.cpp callback body, as existing real NativeRamBlock already does. Completion validates action before use and delivers actual verified byte count/error after releasing lock. No fallback success or fake I/O introduced. Full actual linker log returned and all unresolved symbols parsed as one-element set.", "2026-11-19 final exact-stream review found SID matching masked the high SID bit. Changed comparison to the full 16-bit SID while retaining the architectural 15-bit mask field; real production mock confirms distinct SID0x8060 mapping is never overwritten when creating SID0x60. Generic DT UFS/PHY stay disabled because the explicit b5q driver owns the controller; persistent Data callbacks remain refusals.", "2026-11-19 ROOT-ENABLED BUILD SUCCESS: CI44494359247 commit5b19c2aab0127326f2b95aa5a3cd803de26a6312 compiled and linked actual XNU with mapping_complete=true, missing={}, stubbed={}, allow_missing=false. Actual kernel, FAT payload and matching template Data returned encrypted. Local assembled boot.img 56041472 bytes fits96MiB; macosroot 17603493888 bytes fits48GiB. Actual compiled public root anchors/headers match local signed policies; Data UUID/trust/ADT hashes checked; original PMGR adapters retain correct target bytes/owners; official source POST seal already correct after probe. Kernel transport remains byte-identical, compressed FAT roundtrip passes. User-run installer and Chinese guide plus optional boot-only TAR supplied. This is first hardware candidate; macOS desktop/Metal/input/UFS handoff is not hardware-qualified.", "2026-11-20 v9: b5q-smmu-reuse=1 avoids even mapping apps_smmu and returns before all SMR/S2CR/GR1/CB access. Firmware UFS stream mapping is retained; new physically contiguous DMA compatibility remains hardware-pending. Errors report stage/HCE/HCS/IS/DB/OCS/response/phys. Read-only opcode and authenticated macosroot bounds remain.", "2026-11-20 v9 delivered: CI 44598173747 kernel and official payload steps succeeded with complete mapping, no missing symbols and allow_missing=false. Legacy transport final status PATCH failed HTTP404; all 3024 existing chunks recovered and authenticated locally without rebuilding. ESP800MiB/S4096/s1 SHA256 700af2c8e87b412581190af8e38e23c5993bec244e6c65ce80d32e5815f82f09. Actual ESP-extracted deployment kernel confirms 47-bit user VA and console call; POST and every FAT member roundtrip pass. No QEMU run per latest user; device runtime remains pending.", "2026-11-20 v10: user photo symbolizes to the selectLun fai