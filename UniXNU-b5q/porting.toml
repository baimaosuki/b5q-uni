procedure = ["Use the official package.sh entry point and record the first real failure without marking subsequent steps complete."]
findings = ["The official package script and macOS profile are selected. The first full build failed on unifdef; Ubuntu dependency extraction repaired that error. The retry reached kernel preflight for 17 selected components and then failed because /opt/unixnu-linux/llvm/bin/clang is absent. The official Linux installer requires root and passwordless sudo is unavailable; no CI run has been dispatched. Host privilege evidence is recorded in reports/build-attempt.json.", "The prior artifacts/unixnu-b5q/boot.img is a menu-only build and is not a macOS package output.", "A final package manifest must only be written by the official pipeline after kernel, payload and boot image creation.", "2026-11-19: Official package --check rerun with Samsung inputs available: 130 patches listed, none applied or compiled by that check. The prior full build remains blocked by missing /opt/unixnu-linux/llvm/bin/clang; no new full build ran for this input-inventory request.", "Existing UniversalMac_27.3_26C5035r_Restore.ipsw is present in nabu_macos/out/downloads. macOS-specific SDK/Data seed/Metal addon steps follow the official Mac+Xcode workflow; Linux XNU tools alone do not satisfy them.", "The final deliverable must include separate userdata root-window assembly and policy/layout evidence in addition to kernel, payload, boot and package.manifest.json. Platform seed, runtime board evidence and deployment geometry remain unresolved; no b5q macOS artifacts are claimed.", "2026-11-19: User authorized direct GitHub Actions execution. The new root workflow uses the pinned official macos-26/Xcode flow for the full selected b5q kernel; it does not require the local Linux root installer. Workflow/run outcomes are recorded in reports/ci-stage123.json; dispatch is not itself a build success.", "2026-11-19 CI: source configuration published as 2ae6320faf10534ce17203b7efd7a21febfd32fa. API workflow_dispatch returned HTTP 403; use the repository standard push event with the existing authorized SSH push transport. No remote build result is claimed yet.", "2026-11-19 CI run 44390948642 verified macos-26/Xcode tools and resolved the full b5q target, then failed at the actual kernel build step. Log-archive API access returned HTTP 403; the workflow now captures console output and publishes sanitized failure annotations so the real source/host error can be inspected without claiming a cause from the step name.", "2026-11-19 CI run 44391906629 identified the first actual failure: the generic SoC native-smp-secondary.patch still targets the old board_config.h context. board.toml now selects the official soc:patches/xnu-12377/series. A compiler-independent check applied all 130 patches, in order, to a disposable clone of pinned XNU ac9718fb1af618d5ce8678d0dc6e8a58f252216f: PASS; this is patch application, not a kernel build success.", "2026-11-19 source integration: dts/b5q.dts compiles with the pinned SM8550 DTSI and exports GPU/GMU/SMMU ADT names while keeping UFS disabled. Only confirmed Samsung reservations are listed; runtime DRAM, remaining UH/RKP reservations and live framebuffer stay unknown. The official payload panic_screen entry-probe path is selected, but not claimed executed without a compiled/prelinked kernel.", "2026-11-19 CI run 44392851424 passed the corrected 130-patch sequence and restored five verified public headers. Bootstrap compilation entered libdispatch/libfirehose_kernel and then failed; the long check annotation was truncated, so diagnostics now extract short source-error lines from the nested logs. No compiler error is guessed from a truncated command line.", "2026-11-19: The b5q-only UEFI patch passes git apply --check against the exact baseline archive, and scripts/check-b5q-uefi.py passes required-module and excluded-dispatch checks. Firmware preflight is now independent of payload seed/GPU input checks. CI adds a separate Ubuntu firmware compilation job with matching Clang/LLD 18; this is an actual build attempt, not a claim of successful runtime handoff.", "2026-11-19 CI run 44398657089 built/installed libfirehose_kernel and stopped at the explicit RamBlock/AES closure guard. The board had overridden the OS profile prelinked crypto bootstrap with source and omitted the selected SoftwareAES personality. Remove that board override and enable XNU_NATIVE_AES; keep the full component list and all upstream guards. This config repair does not claim the macOS AES ABI or RamBlock runtime closure qualified.", "2026-11-19: User extended scope through root-storage milestone 4, following completion of the environment/UEFI/kernel milestones and the unchanged RamBlock-before-UFS gate. UEFI compilation reached actual Clang invocations but failed; a dedicated firmware workflow isolates diagnostic repairs from long kernel builds. Its filter no longer mistakes -Werror command flags for errors.", "2026-11-19 local single-module compiler check found raw libfdt calls unsupported by the selected EDK II FdtLib. B5qHandoffDxe now uses the correct Fdt* wrapper interface and builds to an AARCH64 EFI module successfully with Clang 17. The local EDK II revision and EFI hash are recorded separately from the pinned full-CI baseline; this is not a full-FD or hardware success."]
completion = ["The subsystem implementation and required host checks pass; device claims require a separate recorded device result."]
limits = ["No Flip5 macOS hardware qualification or full kernel/payload/boot build is recorded."]
next_action = ["Complete toolchains/Mac runner, local seed and board recipes, then build roots/userdata separately and run the official package pipeline; only report verified existing outputs."]

