r photo shows vm_kern.c475 rangeNONE assertion during4MiB logger allocation; actual v12 startup entry is KMEM6/rankLAST. Production startup/policy/slab host replay reproduces phase5/range0; moving unchanged allocator to OSLOG_FIRST yields phase12/DATA_PRIVATE. SYNC10 wire CDB now has only0x35 with bytes1..15 zero; caller retains validated journal extent gate and all WRITE10 FUA restrictions. Only these two production edits; board/DTS/args/seed/UFS root/firmware unchanged. Compile/binary/ESP verification pending.", "XNU2LOG-v12 complete: CI44626576574 SUCCESS at dfe020141aa42aaf03da15c2c89c502e3cb376c5 with latest core8542980 and Shengc8f92b20 generic runtime alignment. Actual ESP-extracted kernel has inline console-ring stores, serial/panic capture calls, TryLock and WRITE10/SYNC10. Compiled public lockdown handler executed with8-byte0/1 state and error propagation (locks/copyout/PAuth mocked).13 APFS checksums, original trust and signed shim preserved; v11 2GiB seed byte-identical. New800MiB4Kn ESP journal contiguous2051clusters, dualFAT/noaliases/tokenCRC proven. ESP SHA256226cefe802f13751a62d88aaa9ed7b14104c239e4a59ab4ac4d1607293c7d1a4. No hardware boot/writer result or direct flashing claimed; halted CPUs may lose last uncommitted snapshot.", "XNU2LOG target run44623888081 compiled native kernel/archive then failed strict XnuPrelink DATA placement:10MiB static buffers exceeded retained DATA gap. Large buffers now wired VM/IO allocations;64KiB pre-KMEM prefix preserves early output until4MiB promotion. No retained-kext placement checks disabled. CI now returns native kernel/archive intermediates to permit relink/payload reuse on future failure.", "2026-11-20 user latest main alignment: live UniXNU-sheng main remains c8f92b208068eeaa4cd2b0f592671f04ee70076e; all shared lock commits match. Core build pin advanced to8542980d02b4d2cc5c32ee3542de1760b2562aac (only device docs/catalog since old pin). Adopted generic dyld16K-on4K fixups/source release, bindfs file-ID resolution and hw.pagesize access. Added native-state public lockdown sysctl uint64 and explicit cs-lazy/boot-payload-release/exec-log with vmm-present u32. Photo proves PID1 SIGABRT and15.4MB free pages, not its userspace call chain; NABU matching failure is reference evidence. Device hardware tables and policies remain b5q-specific.", "2026-11-20 XNU2LOG-v12: explicit user authorization allows only validated preallocated ESP journal slots. Console capture, isolated discovered-LUN TryLock writer, bounded WRITE10 FUA/SYNC10, raw text token gate and 800MiB4Kn preallocation integrated; v11 RAM Data reused. Production worker/volume/transport/ring tests and original decoder passed locally; combined target build and hardware result pending.", "2026-11-20 new panic photo resolves mapUfsStream+0x1a4 at 0xfffffff00c29a9a0 in the unchanged deployment kernel. B5qSmmu.h:16 reads every S2CR unconditionally while searching for a free context bank. FAR 0xfffffff2854e6c00 has page offset 0xc00, matching S2CR[0] at physical 0x15000c00. This is a denied/unavailable SMMU register access, not evidence that the same virtual allocation is ordinary DRAM. Samsung Gunyah/TZ/firewall/alias ownership mechanism remains undetermined. No storage code was changed in this analysis.", "The board component list selects RamBlock and VerifiedRoot; no ShengUfs root or persistent-data arguments are enabled.", "B5qUfs is not implemented or published as a submodule. A name blacklist alone cannot prevent raw-LBA writes to protected partitions.", "efs/sec_efs/cpefs/param/xbl/abl and slot aliases remain excluded from any proposed write path.", "An existing NABU macOS 27.3 runtime/data.dbr was passed as an external candidate to the build attempt; compilation stopped before seed binding or b5q validation. Its OS, UUID and platform bindings are not claimed verified.", "2026-11-19: Static DT confirms UFS 0x1d84000+0x3000 and ICE 0x1d88000+0x8000; no controller was initialized or accessed.", "Upstream RamBlock provides writable RAM Data, not automatically OS/SystemOS/App root windows. Package.sh omits userdata assembly; root policies and userdata require their separate build step.", "After RAM I/O validation only, implement a bounded b5q UFS root-read path; distinguish controller MMIO command writes from persistent block writes. Default persistent writes stay off, protected endpoints stay inaccessible, and no deployment area or LBA is privately chosen.", "2026-11-19 source integration: dts/b5q.dts compiles with the pinned SM8550 DTSI and exports GPU/GMU/SMMU ADT names while keeping UFS disabled. Only confirmed Samsung reservations are listed; runtime DRAM, remaining UH/RKP reservations and live framebuffer stay unknown. The official payload panic_screen entry-probe path is selected, but not claimed executed without a compiled/prelinked kernel.", "2026-11-19 UEFI source work: b5q DSC/FDF now wires UniXNU, UniXNUDxe, DarwinBoot and UniXNURamDiskDxe, with B5qHandoffDxe read-only runtime FDT/reservations/EFI-map/GOP diagnostics. Explicit UFSDxe/Sdcc/mass-storage/PIL modules and automatic RamManager expansion are removed from b5q dispatch lists. The reproducible patch is recorded in stage123-source-checks.json; no firmware compile, vendor internal-I/O audit, Samsung guard completion or runtime result is claimed.", "2026-11-19 CI run 44398657089 built/installed libfirehose_kernel and stopped at the explicit RamBlock/AES closure guard. The board had overridden the OS profile prelinked crypto bootstrap with source and omitted the selected SoftwareAES personality. Remove that board override and enable XNU_NATIVE_AES; keep the full component list and all upstream guards. This config repair does not claim the macOS AES ABI or RamBlock runtime closure qualified.", "2026-11-19: User extended scope through root-storage milestone 4, following completion of the environment/UEFI/kernel milestones and the unchanged RamBlock-before-UFS gate. UEFI compilation reached actual Clang invocations but failed; a dedicated firmware workflow isolates diagnostic repairs from long kernel builds. Its filter no longer mistakes -Werror command flags for errors.", "2026-11-19: RamBlock original pinned sparse host test fails because it rejects 2GiB+4KiB while its current parser explicitly allows up to 1TiB. A disposable-test runner corrects only that negative input to 1TiB+4KiB, retaining all assertions and unmodified parser, and runs all five host suites with ASan/UBSan. Host tests do not pass the phone UFS hardware gate.", "2026-11-19: all five actual RamBlock host suites PASS with ASan/UBSan after the documented disposable negative-boundary correction. Added independent CI for the same tests and VerifiedRoot real RSA/C parser mutation tests. The pinned ShengUfs source was fetched exactly and audited: its LUN0 userdata layout, SMMU stream 0x1401, DPU takeover and physical addresses are board policy, not b5q transport evidence. None is copied or enabled; no B5qUfs hardware driver or real root mount is claimed.", "2026-11-19: CI 44409204189 completed SUCCESS for both RamBlock and VerifiedRoot jobs, including actual RSA signature/C parser mutation tests. Five pinned generic UFS algorithms also pass local ASan/UBSan checks after a disposable LP64 test-literal fix; the production headers are unchanged. No phone controller initialization or mounted root is tested.", "Reference RootWindowRead, RootPublication, RootDiagnostics, TransferPoll and CompletionWait host tests pass with production source unchanged. Their mock transport does not qualify Samsung SMMU/DMA ownership or assign deployment extents.", "Round 1 RAM-only closure: build actual pinned macOS IOBlockStorageDevice with original-parent deferred metaclass and actual RamBlock/VerifiedRoot. No NativeUfs source is included. Optional persistence callbacks explicitly return absent/error and perform no I/O. New 512MiB APFS seed is a volatile compile-bring-up filesystem, not a copied installation or full macOS system root.", "2026-11-19 user-provided GPT: 4096-byte LBA consistent with all exact sizes; esp 3162880..3367679 is 838860800 bytes, macosroot 49692663..62275574 is 51539607552 bytes. userdata 3406336..47595510 remains separate, with an 8GiB gap before macosroot. Source is pasted listing, not a device read; UFS LUN and transport cannot be inferred. The existing RAM-only kernel still refuses native_ufs_store_read/open and leaves native_owner_root_accepted=0/mount_device=NODEV; a root image alone cannot make it mount macosroot. No controller or protected partition operation performed.", "2026-11-19: actual root image 17603493888 bytes SHA256 35b1c581c7074c626b4b3750af93901a988425e42671f1aaeafd7fd6e13de199 fits the user macosroot capacity 51539607552 bytes. Root windows and three hash-table objects pass independent full-stream SHA256 and header/bounds checks; C verified all 4263936 source blocks. Template Data first-install preparation now succeeds, but no root-reading b5q storage provider or kernel policy binding has been implemented or enabled. flash-macosroot.sh refuses before ADB while package status remains false; no partitions are touched.", "2026-11-19 user explicitly lifts B5qUfs pause and authorizes a first root-reader build. New b5q implementation uses Samsung stock DT proven controller 0x1d84000+0x3000, SMMU 0x15000000+0x100000 and exact SID 0x60 (all four stock base DTBs agree). Warm handoff only: no GPIO/PHY/clock writes; quiesce queues, allocate bounded DMA and isolate only exact UFS stream to an unused bypass bank. SCSI allowlist READ CAPACITY16/READ16 only. GPT metadata reads confined LBAs1..264, CRC and unique macosroot plus supplied bounds required before any root data reads. New source root devices authenticate compiled RSA headers and full per-block tables; no persistent write commands. Real XNU owner-root audit and volume-device binding enabled; Data is RAM-only and exact UUID-bound. Host actual manifest/GPT negative cases pass ASan/UBSan; hardware runtime remains unobserved.", "2026-11-19 first actual UFS CI 44487231271 reached the new source compile and reported exactly two ABI/compiler errors: mixed IOOptionBits enum OR and IOBlockStorageDevice init requires explicit OSDictionary*. Both fixed as a batch; parser narrowing warning fixed too. LUN discovery now queries read-only Unit descriptors to exclude boot-LUN units before capacity/GPT reads, and ignores devices smaller than target bounds. Original static/System/App trust bundles are freshly extracted before payload. GOP phase4 CPU display path selected, and actual EFI-owned memory request raised to2GiB to cover full verified tables and user-space needs; no physical DRAM location copied.", "2026-11-19 CI44489337860 compiled new UFS source and root-binding but stopped at B5qPmgr.cpp:30 due to forward-only IOPlatformExpert declaration; added the actual IOKit/IOPlatformExpert.h inheritance definition. Extracted the production SMMU exact-stream algorithm into B5qSmmu.h and tested actual writes with ASan/UBSan mocks: unrelated display streams/banks unchanged, masked/duplicate matches and busy banks rejected. No physical UFS result is claimed.", "2026-11-19 CI44491129022 completed all storage/PMGR/GOP/Adreno archives and reached final XNU link. Exactly one unresolved symbol remained: IOStorage::complete(IOStorageCompletion*, int, unsigned long long), called at B5qUfs.cpp in doAsyncReadWrite. Replaced that non-exported convenience wrapper with its exact public IOStorage.cpp callback body, as existing real NativeRamBlock already does. Completion validates action before use and delivers actual verified byte count/error after releasing lock. No fallback success or fake I/O introduced. Full actual linker log returned and all unresolved symbols parsed as one-element set.", "2026-11-19 final exact-stream review found SID matching masked the high SID bit. Changed comparison to the full 16-bit SID while retaining the architectural 15-bit mask field; real production mock confirms distinct SID0x8060 mapping is never overwritten when creating SID0x60. Generic DT UFS/PHY stay disabled because the explicit b5q driver owns the controller; persistent Data callbacks remain refusals.", "2026-11-19 ROOT-ENABLED BUILD SUCCESS: CI44494359247 commit5b19c2aab0127326f2b95aa5a3cd803de26a6312 compiled and linked actual XNU with mapping_complete=true, missing={}, stubbed={}, allow_missing=false. Actual kernel, FAT payload and matching template Data returned encrypted. Local assembled boot.img 56041472 bytes fits96MiB; macosroot 17603493888 bytes fits48GiB. Actual compiled public root anchors/headers match local signed policies; Data UUID/trust/ADT hashes checked; original PMGR adapters retain correct target bytes/owners; official source POST seal already correct after probe. Kernel transport remains byte-identical, compressed FAT roundtrip passes. User-run installer and Chinese guide plus optional boot-only TAR supplied. This is first hardware candidate; macOS desktop/Metal/input/UFS handoff is not hardware-qualified.", "2026-11-20 v9: b5q-smmu-reuse=1 avoids even mapping apps_smmu and returns before all SMR/S2CR/GR1/CB access. Firmware UFS stream mapping is retained; new physically contiguous DMA compatibility remains hardware-pending. Errors report stage/HCE/HCS/IS/DB/OCS/response/phys. Read-only opcode and authenticated macosroot bounds remain.", "2026-11-20 v9 delivered: CI 44598173747 kernel and official payload steps succeeded with complete mapping, no missing symbols and allow_missing=false. Legacy transport final status PATCH failed HTTP404; all 3024 existing chunks recovered and authenticated locally without rebuilding. ESP800MiB/S4096/s1 SHA256 700af2c8e87b412581190af8e38e23c5993bec244e6c65ce80d32e5815f82f09. Actual ESP-extracted deployment kernel confirms 47-bit user VA and console call; POST and every FAT member roundtrip pass. No QEMU run per latest user; device runtime remains pending.", "2026-11-20 v10: user photo symbolizes to the selectLun failure, not the former apps_smmu exception. Auditing missing standard UFS device wake/TEST UNIT READY, CHECK CONDITION residual handling, detailed per-LUN/GPT rejection and every signed-root boundary. Observed OCS/type do not establish SCSI GOOD or actual Samsung power mode. Standard UFS protocol helpers added; no Xiaomi board constants, SMMU changes or persistent writes.", "2026-11-20 v10 implementation complete: standard NOP/power attribute/conditional D0 SSU ACTIVE/power requery and per-normal-LUN TUR retries precede capacity. CHECK CONDITION residual/sense no longer poison transport. Zero-data and read command allowlists are separate; no block writes. GPT exact root bounds, CRC and backup-LBA checks remain; the arbitrary entry-count cap now permits8192x128 within the unchanged1MiB/LBA1..264 metadata envelope. Panic includes power before/after, SCSI/sense, LUN/capacity, exact GPT and per-LUN reasons. Local16-check pre-CI including production protocol regression and actual root image/policy hashes PASS. Ordinary Actions artifact only; no QEMU.", "2026-11-20 latest user review adds mandatory SCSI READ10 (0x28) for all authorized32bit root/metadata LBAs, exact CDB fields and byte/count validation. READ16 remains only for larger addresses. Production-helper tests cover both wire layouts, actual root endpoints and overflows; already-running prior CI is retained and a corrected build follows without cancelling/discarding outputs.", "2026-11-20 v10 final: corrected READ10 source b6fd887c07b729e7e6a36d144aabe04f7648b842 compiled and packaged successfully in CI44606991063. Ordinary artifact SHA256 verified after a rejected initial digest mismatch and successful retry. Actual ESP-extracted rootRead disassembly has mov w11,#0x28 and CDB field stores; wake/ready commands and full panic diagnostic strings present. Complete prelink without missing symbols, POST idempotence, signed-root inputs, typed ADT and every FAT member roundtrip PASS. Single800MiB4Kn esp.img SHA256 8b64abce3ee1b4338d3614e8b46e82d0a2d253871b4b0869203ad78b37990087. No QEMU or device access; actual post-wake SCSI/root mount remains a device milestone.", "2026-11-20 XNU2LOG investigation: found the actual NABU NABUCFG2/NABULOG2 dual-slot kernel journal, its generator, RAM console capture, bounded ESP writer and decoder in /home/baimao/nabu_macos. Created only the requested new8400896-byte blank allocation with a fresh identity; config matches the original generator and passes production C verifier plus corruption/token negatives, both slots uncommitted and no captured log fabricated. b5q-v10 has no console-capture/logger integration or enabled persistent writes; its delivered ESP remains unchanged. Generic format reuse does not authorize copying NABU LUN0, GPT128-entry limit or hardware/partition values.", "2026-11-20 mount-v11: user reports UFS/root/launchd progress and mount-phase-1 abort. Source confirms29GiB seed writes refused by isBig&&!direct, missing runtime APFS boot shim and key-events gate. Payload-only rebuild reuses v10 kernel, requests4GiB owned memory, builds2GiB volatile Data with actual compiled48D8 UUID (attachment48D0 is wrong), adds typed maxvnodes and documented startup arguments. Scoped host-tool patch permits2GiB and disables watchdogd only in fresh RAM Data. Ordinary artifacts, no probes/QEMU/firmware build or phone access.", "2026-11-20 mount-v11 complete: payload-only CI44616733365 SUCCESS; existing v10 kernel SHA256bac7ef5ea50ecbb22767755d26b560dd7de220a95998fa09e31e3c4f4f5d5835 byte-identical in new ESP. Actual2GiB seed imported and volatile sector written/read with production SparseDisk.h under ASan/UBSan.13 APFS superblock checksums and actual48D8 volumeUUID verified; watchdogd disable plist present. APFS shim and absentd SHA256/4K CodeDirectories/code-slot hashes match added owner trust; original Apple trust modules byte-identical. ADT4GiB owned memory, maxvnodes66560 and all five new arguments verified. Single800MiB4Kn esp.img SHA256dd5983250f0529cfbdbb8f7aba96bd44941ef3b5f25068b42fc01d9367c807f3. No XNU/firmware compile, QEMU or device access. Hardware mount-phase outcome pending.", "2026-11-20 v16 audit: bounded3attempt idempotent root reads now handle existing retryable SCSI statuses; capture per-command response under host lock before journal can overwrite host.status. Actual production command/read test simulates status mutation at unlock and confirms UA/BUSY/TASK SET FULL handling; terminal errors and protected/root/write bounds unchanged.", "2026-11-20 v16 complete: actual returned ARM64readLba instructions pass10mocked-transport cases including BUSY/TASK SET FULL/UA/NOT READY recovery, exhaustion, illegal/short/transport/poison failure. Original source race reproduced at unlock and fixed completion snapshot under lock. Root bounds/verification unchanged.", "v17 source audit: actual root dispatch/real VerifiedRoot SHA256 replay proves 1MiB UFS commands256->8 with128KiB scratch, per4KiB authenticate-before-copy, exact unaligned/bad-hash/error prefixes and corrected shortcopy completion. Root remains read-only; no signed verification changes or device throughput claim.", "2026-11-20 v17 complete: one CI44746455235 SUCCESS source1a3cd004;25localchecks,6case actual ARM64batchdispatch/compiledblockverifier,10case readretry and existing logger/Ethernet/POST/trust/APFS/FAT proofs PASS. ESP800MiB4Kn SHA256d1ef17bd1eebde4efe8c17a948b50a18c1de093142070a4704d55a296e045371. Exact new kernel/Data staging tested for future payload-only reuse. Latest actual hardware log remainsv14; no new physical outcome claimed."]
