opy to require idempotence. Existing loader binaries contain darwinboot-memory-size/PackedRAMDisk/DBRDISK1 and UNXNFAT1 support. Actual previous FAT compressed to39792280 bytes and decoded SHA256-identically using pinned official codec; final candidate is checked again. Local boot-only Odin TAR and Chinese input/installation guide added; source README now reflects explicitly authorized read-only root development. No final candidate published until final CI and assembly verification succeed.", "2026-11-19 latest user requires all added integrity checks to run locally before CI, not as mid-CI acceptance gates. Removed custom workflow record/template and tool-verification steps, moved supplemental seed identity/digest and payload-member verification out of CI helpers. New local pre-ci.py runs 14 concrete source/input/fixture/parser/installer/DTS checks and records source hashes; actual generated files are verified locally after return. Original upstream build/link/package operations remain. Root-enabled run44493823201 completed SUCCESS and 24 actual files returned; existing builds are preserved. Documentation/tooling update uses skip-ci rather than launching another redundant kernel build.", "2026-11-19 ROOT-ENABLED BUILD SUCCESS: CI44494359247 commit5b19c2aab0127326f2b95aa5a3cd803de26a6312 compiled and linked actual XNU with mapping_complete=true, missing={}, stubbed={}, allow_missing=false. Actual kernel, FAT payload and matching template Data returned encrypted. Local assembled boot.img 56041472 bytes fits96MiB; macosroot 17603493888 bytes fits48GiB. Actual compiled public root anchors/headers match local signed policies; Data UUID/trust/ADT hashes checked; original PMGR adapters retain correct target bytes/owners; official source POST seal already correct after probe. Kernel transport remains byte-identical, compressed FAT roundtrip passes. User-run installer and Chinese guide plus optional boot-only TAR supplied. This is first hardware candidate; macOS desktop/Metal/input/UFS handoff is not hardware-qualified.", "2026-11-19 delivery complete locally: b5q-macos-27.3-firstboot-v1.tar.zst is13796848064 bytes SHA2562f38dd69de0ecda756264be774fc2ac4094d302cd87b0153e5f6b0a1dc9f9c81; compressed stream and all33 listed archive-member hashes pass independent local verification. Final directory contains kernel.macho142983168, payload.img268435456, boot.img56041472, boot-only TAR56043520 and authenticated macosroot.img17603493888 bytes; manifest20944 bytes. Source/build/evidence publication uses skip-ci, with no new kernel run or phone writes. Actual hardware boot remains unverified.", "2026-11-19 user reports v1 boot/root readback match but still executes old HelloPayload. Confirmed installation defect: v1 script writes no physical ESP; packed payload contents alone did not update the live menu tree. Actual EFI QEMU reproduction also confirms undeclared DarwinBoot.efi is not loaded (no loader protocol), despite file presence. Exact embedded RAM driver contains UNXNFAT1 support, so bare-FAT-only claim is unproven; runtime mount chain was not exercised by earlier host roundtrip. Corrective delivery uses explicit 800MiB esp.img and --repair installs ESP then boot without rewriting root; boot now uses plain FAT16 with no menu config to shadow physical ESP. Local real-PE/multi-disk emulation being executed. No XNU rebuild or CI run.", "2026-11-19 ESP-v2 delivery complete locally. Actual emitted16MiB FAT16 bootstrap and800MiB raw FAT32 ESP executed together in AAVMF/QEMU: real UniXNU discovers second volume config, loads declared DarwinBoot successfully, selects xnu and hands off to loader. Rejects old HelloPayload/missing-loader/ASSERT in log. QEMU1GiB cannot allocate2GiB XNU window and reports Out of Resources; kernel boot is not tested. Exact new esp.img SHA2568732f8266084c7a07bcc4f966403375c57dc661ed6b75351e071f7ccc2dd473b; boot.img19275776 bytes SHA25679618ef587f12f058ab07442850305e16ff9028131d37a55177c4e6df544ee25. --repair validates a