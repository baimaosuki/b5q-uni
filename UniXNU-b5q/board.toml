schema_version = 2

[board]
name = "b5q"
soc = "SM8550-AC"
soc_source = "sm8550"
os_profile = "macos-27.3-26C5035r"
kit = "b5q"
description = "Samsung Galaxy Z Flip5 macOS 27.3 port in development; source selection is not hardware qualification"

[components]
include = [
  "ArmDTPlatform", "ArmCpu", "DarwinBoot", "XnuPrelink",
  "SoftwareAES", "AppleKeyStoreState", "GopFramebuffer",
  "Adreno740", "AdrenoMetal", "QcomDwc3", "QcomGeniSpi",
  "RamBlock", "VerifiedRoot",
]

[kernel]
defconfig = "b5q_macos_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/macos.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# b5q OS ABI binder excludes all sheng peripheral aggregation.
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform", "component:ArmCpu", "build-libpthread-kernel.py", "build-b5q-storage.py", "build-b5q-gop-27.py", "build-b5q-adreno.py"]

[kernel.embedded_components]
RamBlock = "build-b5q-storage.py"
Adreno740 = "build-b5q-adreno.py"
SoftwareAES = "build-b5q-gop-27.py"
AppleKeyStoreState = "build-b5q-gop-27.py"

[device_tree]
source = "device:dts/b5q.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "b5q"
dsc = "Platforms/Samsung/b5qPkg/b5q.dsc"
fd = "Build/b5qPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
preflight = ["scripts/check-b5q-uefi.py"]
packages = [
  "{uefi}", "{uefi}/Platforms/Samsung", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}",
  "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Samsung",
  "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Samsung", "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
DEVICE_MODEL = "b5q"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "b5q-macos27-development"

[payload]
volume = "B5QUNIXNU"
size_mib = 256
loader = "firmware"
title = "UniXNU b5q macOS 27.3"
panic_screen = true
# Sheng macOS 27.3 hardware-Metal display policy, same inspected build.
# CPU renderer overrides from v15/v18 are excluded from this hardware path.
text_fixups = [
  "dyld_shared_cache_arm64e.03,5de1134,08060037,1f2003d5",
  "dyld_shared_cache_arm64e.03,5de63cc,1811981a,f803082a",
  "dyld_shared_cache_arm64e.03,5c3685c,a00180524039a672010080d2020080d2,68ca42f9c800e037e00313aa010080d2",
  "dyld_shared_cache_arm64e.03,5c3686c,030080d2040080d28ffd8294,e1a5ff971f2003d51f2003d5",
  "dyld_shared_cache_arm64e.03,28bb658,ce674e95,00008052",
  "dyld_shared_cache_arm64e.03,6cf7304,fb214094,00008052",
  "dyld_shared_cache_arm64e.03,239d0ec,a1ab6595,00008052",
]
tools = true
# b5q-root selects authenticated read-only macosroot; Data remains volatile in RAM.
# The existing ArmCpu secondary/SM8550 IPI path is opt-in. no-lc selects the
# already-built launch-constraint policy for signed, owner-trusted boot shims.
kernel_args = ["-v", "debug=0x14e", "use_contiguous_hint=0", "kt_fixed_zones=120", "-no_slto_panic", "smp=1", "armcpu-spi-ipi=1", "armcpu-self-ipi=1", "no-lc=1", "ethernet=1", "vsync=60", "vc-text=1", "native-source-storage=1", "b5q-root=1", "b5q-smmu-reuse=1", "offline-mobile-graphics-load=1", "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "offline-legacy-phase=4", "aks=1", "aks-sls=3", "offline-key-events=1", "apfs-boot-shim=1", "timebase-hz=24000000", "cs-lazy=1", "boot-payload-release=1", "b5q-ws-signal=1", "b5q-usb=1", "gpu-power=9", "gpu-metal=1", "fb-gpu=1", "fb-bgra=1", "fb-half=2", "gpu-dcvs=1", "gpu-addon=1", "b5q-log=1", "b5q-log-token=411839cbaebac4088c251c0ea57579a2", "timebase-user=1", "sched_preemption_disable_debug_mode=0", "interrupt-masked-debug-mode=0", "validation_disables=0x11040", "ca-triple-buffer=1", "ca-free-wakeup=1", "cpufreq=3", "thermal=1", "thermal-ms=100", "thermal-level=1", "board-clock=1", "offline-hid-input=0", "offline-hid-home=1", "buttons=0", "touch=0", "touch-hid=0", "b5q-dpi=425", "dpu=1", "offline-legacy-unit-scale=2"]

[payload.adt]
# EFI allocator chooses a real contiguous window; no physical DRAM address is invented.
owned_memory_size = "0x100000000"
chip_id = "6050"
unique_chip_id = "required"
packed_data_ramdisk = true

# XNU requires this property to be exactly sizeof(int), including when CTRR is absent.
[adt.chosen.u32]
kernel-ctrr-to-be-enabled = 0

# The device has no implemented suspend path (official device-tree guide).
[adt.defaults.u32]
sleep-disabled = 1
"kern.maxvnodes" = 66560
# macOS guest-platform policy, consumed by kern.hv_vmm_present.
"vmm-present" = 1

[package]
unixnu = "../UniXNU"

[package.defconfig]
"macos-27.3-26C5035r" = "b5q_macos_defconfig"

# Original owner-trusted boot shims and native macOS Metal addon.
[payload.runtime]
tool = "scripts/build-boot-runtime.py"
target = "macos27"
build = "26C5035r"
data_seed_tool = "scripts/make-macos-data-seed.py"
data_gib = 2
skip_setup = true
boot_shims = true
gpu_addon = true
trust_components = ["StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppTrustCache"]
