schema_version = 2

[board]
name = "b5q"
soc = "SM8550-AC"
soc_source = "sm8550"
os_profile = "macos-27.3-26C5035r"
kit = "b5q"
description = "Samsung Galaxy Z Flip5 macOS 27.3 port in development; source selection is not hardware qualification"

[components]
include = [
  "ArmDTPlatform", "ArmCpu", "DarwinBoot", "XnuPrelink",
  "SoftwareAES", "AppleKeyStoreState", "GopFramebuffer",
  "Adreno740", "AdrenoMetal", "QcomDwc3", "QcomGeniSpi",
  "RamBlock", "VerifiedRoot",
]

[kernel]
defconfig = "b5q_macos_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/macos.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# b5q OS ABI binder excludes all sheng peripheral aggregation.
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform", "component:ArmCpu", "build-libpthread-kernel.py", "component:RamBlock", "build-b5q-gop-27.py", "component:Adreno740"]

[kernel.embedded_components]
SoftwareAES = "build-b5q-gop-27.py"
AppleKeyStoreState = "build-b5q-gop-27.py"

[device_tree]
source = "device:dts/b5q.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "b5q"
dsc = "Platforms/Samsung/b5qPkg/b5q.dsc"
fd = "Build/b5qPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
preflight = ["scripts/check-b5q-uefi.py"]
packages = [
  "{uefi}", "{uefi}/Platforms/Samsung", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}",
  "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Samsung",
  "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Samsung", "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
DEVICE_MODEL = "b5q"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "b5q-macos27-development"

[payload]
volume = "B5QUNIXNU"
size_mib = 256
loader = "firmware"
title = "UniXNU b5q macOS 27.3"
panic_screen = true
tools = true
# No UFS-root, persistence, Xiaomi GPIO or GPU power votes are enabled by these arguments.
kernel_args = ["-v", "debug=0x14e", "vc-text=1"]

[payload.adt]
chip_id = "6050"
unique_chip_id = "required"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"macos-27.3-26C5035r" = "b5q_macos_defconfig"
